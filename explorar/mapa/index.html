  // header until the visible map shell owns the canonical title row.
  var lastRoute=location.pathname;
  setInterval(function(){
    var now=location.pathname;
    if(now!==lastRoute){
      lastRoute=now;
      [0,60,160,320,650,1100,1800].forEach(function(ms){setTimeout(schedule,ms)});
    }
    if(mq.matches&&fullMapActive()&&!currentMapHeaderReady()){
      mapHeader();
    }
  },250);

  [0,80,220,600,1400,2800].forEach(function(ms){setTimeout(schedule,ms)});
})();
</script>
