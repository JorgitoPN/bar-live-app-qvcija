name: Apply BarLive early style bootstrap

on:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/apply-map-early-style.yml'
      - '.github/scripts/apply-map-early-style.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-production-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - name: Patch early style bootstrap
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/apply-map-early-style.js
          grep -Fq 'canonical-map-v15-early-style-11fa1d5-20260926' index.html
          grep -Fq 'startupPrewarmPromise' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq 'map.style && map.style._loaded' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq 'bootstrapCanonicalMap("internal-ready")' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq '/sw.js?v=28' index.html
          grep -Fq 'canonical-map-v15-early-style' version.json
      - name: Commit v15 production bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No production changes needed.'
            exit 0
          fi
          git add _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js \
            index.html 404.html explorar/mapa/index.html sw.js version.json
          git add explorar/index.html detalle/local/index.html 2>/dev/null || true
          git commit -m 'perf(web-map): bootstrap source on internal style readiness'
          git push origin gh-pages
