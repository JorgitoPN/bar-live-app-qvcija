name: Apply BarLive lazy tabs

on:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/apply-tabs-lazy.yml'
      - '.github/scripts/apply-tabs-lazy.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-production-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - name: Patch tabs lazy flags
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/apply-tabs-lazy.js
          grep -Fq 'canonical-map-v16-lazy-tabs-cd9df5d-20260926' index.html
          grep -Fq "tabBarStyle:{display:'none'},lazy:!0" _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq '/sw.js?v=29' index.html
          grep -Fq 'canonical-map-v16-lazy-tabs' version.json
      - name: Commit v16 production bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No production changes needed.'
            exit 0
          fi
          git add _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js \
            index.html 404.html explorar/mapa/index.html sw.js version.json
          git add explorar/index.html detalle/local/index.html 2>/dev/null || true
          git commit -m 'perf(web): lazily mount inactive tab screens'
          git push origin gh-pages
