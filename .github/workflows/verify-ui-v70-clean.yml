name: Verify BarLive UI v70 clean

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-ui-v70-clean.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect rendered DOM
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          OUT=diagnostics/ui-v70-clean.txt
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          {
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            curl -sSL --max-time 30 https://barliveapp.es/ -o /tmp/root.html
            grep -o 'barlive-production:[^<]*' /tmp/root.html | head -n 1
            for ROUTE in explorar/mapa explorar perfil eventos social; do
              DOM="/tmp/dom-$(echo "$ROUTE" | tr '/' '-').html"
              CLEAN="$DOM.clean"
              "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage                 --window-size=1440,1000 --virtual-time-budget=12000                 --dump-dom "https://barliveapp.es/$ROUTE/" > "$DOM" 2>/dev/null
              python3 - "$DOM" "$CLEAN" <<'PY'
import re,sys
raw=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
raw=re.sub(r'<script\b[^>]*>[\s\S]*?</script>','',raw,flags=re.I)
raw=re.sub(r'<style\b[^>]*>[\s\S]*?</style>','',raw,flags=re.I)
open(sys.argv[2],'w',encoding='utf-8').write(raw)
PY
              echo "=== /$ROUTE/ ==="
              echo -n "map_header="; grep -o 'data-barlive-map-category-header-v70="true"' "$CLEAN" | wc -l
              echo -n "map_title="; grep -o 'data-barlive-map-title-v70="true"' "$CLEAN" | wc -l
              echo -n "contrast_controls="; grep -o 'data-barlive-contrast-control-v70="true"' "$CLEAN" | wc -l
              echo -n "page_canvas="; grep -o 'data-barlive-page-canvas-v70="true"' "$CLEAN" | wc -l
              echo -n "purple_known="; grep -Eio '#(641B73|53155F|45114F|F4EAF6|EADAF0|8E4C99|7C3AED|EDE9FE|6D28D9|8B5CF6|A855F7|9333EA|5B21B6|4C1D95|312E81|1E1B4B|6366F1|4F46E5|C4B5FD|DDD6FE|F5F3FF)' "$CLEAN" | wc -l
              grep -o 'Mapa</div><div class="barlive-map-subtitle-v70">[^<]*' "$CLEAN" | head -n 1
            done
          } > "$OUT" 2>&1
      - name: Commit report
        shell: bash
        run: |
          git config user.name "barlive-ui-verifier"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/ui-v70-clean.txt
          git commit -m "diagnostic: verify clean BarLive UI v70 [skip ci]" || exit 0
          git push origin HEAD:main
