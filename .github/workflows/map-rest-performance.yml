name: Map REST viewport performance

on:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/map-rest-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Benchmark current canonical venue query
        shell: bash
        env:
          APIKEY: sb_publishable_ffrXoLqKentwGrBXq3ZTDg_WxsX2y_2
        run: |
          set -euo pipefail
          BASE='https://embntaqwlwmgazvrglaf.supabase.co/rest/v1/locales'
          SELECT='id,latitud,longitud,barlive_type,barlive_types,destacado,horarios_completos,google_business_status,osm_opening_hours:osm_tags->>opening_hours'
          PAGE=1000

          page() {
            local name="$1" south="$2" north="$3" west="$4" east="$5" offset="$6"
            local url out metrics count
            out="/tmp/${name}-${offset}.json"
            url="$BASE?select=$SELECT&activo=eq.true&latitud=gte.$south&latitud=lte.$north&longitud=gte.$west&longitud=lte.$east&order=id.asc&limit=$PAGE&offset=$offset"
            metrics="$(curl --connect-timeout 15 --max-time 60 -sS -o "$out" \
              -w 'http=%{http_code} total=%{time_total} start=%{time_starttransfer} bytes=%{size_download}' \
              -H 'Accept: application/json' \
              -H "apikey: $APIKEY" \
              "$url")"
            count="$(jq 'length' "$out")"
            echo "MAP_PAGE name=$name offset=$offset rows=$count $metrics"
          }

          benchmark_offsets() {
            local name="$1" south="$2" north="$3" west="$4" east="$5" max_offset="$6"
            local offset
            for offset in $(seq 0 1000 "$max_offset"); do
              page "$name" "$south" "$north" "$west" "$east" "$offset"
            done
          }

          # Same padded bounds observed by the production browser smoke.
          benchmark_offsets madrid 40.35471 40.47887 -3.80132 -3.60628 8000
          benchmark_offsets barcelona_z11 41.14026 41.62968 1.78332 2.56348 11000
