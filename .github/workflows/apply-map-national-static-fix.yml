name: Apply BarLive map national-static fix

on:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/apply-map-national-static-fix.yml'
      - '.github/scripts/apply-map-national-static-fix.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-production-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Patch canonical map bundle
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/apply-map-national-static-fix.js
          grep -Fq 'canonical-map-v8-national-static-4c27282-20260926' index.html
          grep -Fq 'NATIONAL_SNAPSHOT_URL' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq '[MAP_RENDER][NATIONAL_STATIC_FETCH]' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq 'activeDatasetMode' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq '/sw.js?v=21' index.html
          grep -Fq 'canonical-map-v8-national-static' version.json

      - name: Commit v8 production bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No production changes needed.'
            exit 0
          fi
          git add _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js \
            index.html 404.html explorar/mapa/index.html sw.js version.json
          git add explorar/index.html detalle/local/index.html 2>/dev/null || true
          git commit -m 'perf(web-map): use static national snapshot at far zoom'
          git push origin gh-pages
