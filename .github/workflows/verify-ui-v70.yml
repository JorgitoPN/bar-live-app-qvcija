name: Verify BarLive UI v70

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-ui-v70.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify live UI
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          OUT=diagnostics/ui-v70-live.txt
          {
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "=== LIVE HTML ==="
            curl -sSL --max-time 30 https://barliveapp.es/ -o /tmp/root.html
            grep -o 'barlive-production:[^<]*' /tmp/root.html | head -n 2
            grep -o 'barlive-ui-master-v70' /tmp/root.html | sort -u
            echo -n "root_bytes="; wc -c < /tmp/root.html
            echo
            CHROME="$(command -v google-chrome || command -v chromium || true)"
            echo "chrome=$CHROME"
            for ROUTE in explorar/mapa explorar perfil eventos social; do
              echo "=== ROUTE /$ROUTE/ ==="
              DOM="/tmp/dom-$(echo "$ROUTE" | tr '/' '-').html"
              "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage                 --window-size=1440,1000 --virtual-time-budget=12000                 --dump-dom "https://barliveapp.es/$ROUTE/" > "$DOM" 2>/dev/null
              echo -n "dom_bytes="; wc -c < "$DOM"
              echo -n "map_header="; grep -o 'data-barlive-map-category-header-v70="true"' "$DOM" | wc -l
              echo -n "map_title="; grep -o 'data-barlive-map-title-v70="true"' "$DOM" | wc -l
              echo -n "contrast_controls="; grep -o 'data-barlive-contrast-control-v70="true"' "$DOM" | wc -l
              echo -n "page_canvas="; grep -o 'data-barlive-page-canvas-v70="true"' "$DOM" | wc -l
              echo -n "navy_inline="; grep -io 'color: *#122348\|color: *rgb(18, 35, 72)' "$DOM" | wc -l
              echo -n "purple_known="; grep -Eio '#(641B73|53155F|45114F|F4EAF6|EADAF0|8E4C99|7C3AED|EDE9FE|6D28D9|8B5CF6|A855F7|9333EA|5B21B6|4C1D95|312E81|1E1B4B|6366F1|4F46E5|C4B5FD|DDD6FE|F5F3FF)' "$DOM" | wc -l
              grep -o 'Mapa</div><div class="barlive-map-subtitle-v70">[^<]*' "$DOM" | head -n 1
              echo
            done
          } > "$OUT" 2>&1

      - name: Commit report
        shell: bash
        run: |
          git config user.name "barlive-ui-verifier"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/ui-v70-live.txt
          git commit -m "diagnostic: verify BarLive UI v70 live [skip ci]" || exit 0
          git push origin HEAD:main
