name: Enable GitHub Pages for BarLive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-emergency-pages.yml"
      - ".github/workflows/build-zero-cost-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable or update Pages from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          STATUS="$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${AUTH[@]}" "${API}")"
          if [ "${STATUS}" = "404" ]; then
            curl --fail-with-body -sS -X POST "${AUTH[@]}" "${API}" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
          else
            curl --fail-with-body -sS -X PUT "${AUTH[@]}" "${API}" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
          fi
