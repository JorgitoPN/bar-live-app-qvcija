name: Publish BarLive emergency web

on:
  push:
    branches: [main]
    paths:
      - "emergency-site/**"
      - ".github/workflows/publish-emergency-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: barlive-emergency-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: emergency-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
