name: Map national snapshot contract

on:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/map-national-snapshot-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure static national snapshot
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT='https://barliveapp.es/map-data/national-venues-v1.json?contract=20260926-v1'
          META='https://barliveapp.es/map-data/national-venues-v1.meta.json?contract=20260926-v1'

          meta_result="$(curl --fail --silent --show-error --location --compressed             --connect-timeout 15 --max-time 60             --write-out '%{http_code} %{time_total} %{size_download}'             --output /tmp/meta.json "$META")"
          echo "NATIONAL_STATIC_META_RESULT=$meta_result"
          cat /tmp/meta.json
          echo

          jq -e '.count > 100000' /tmp/meta.json >/dev/null
          jq -e '.gzipBytes > 0 and .bytes > .gzipBytes' /tmp/meta.json >/dev/null

          snapshot_result="$(curl --fail --silent --show-error --location --compressed             --connect-timeout 15 --max-time 90             --write-out '%{http_code} %{time_total} %{size_download}'             --output /tmp/snapshot.json "$SNAPSHOT")"
          echo "NATIONAL_STATIC_SNAPSHOT_RESULT=$snapshot_result"

          python - <<'PY'
          import json, os
          with open('/tmp/snapshot.json', encoding='utf-8') as f:
              payload=json.load(f)
          rows=payload.get('rows') or []
          print('NATIONAL_STATIC_VERSION=', payload.get('v'))
          print('NATIONAL_STATIC_COUNT=', len(rows))
          print('NATIONAL_STATIC_DECODED_BYTES=', os.path.getsize('/tmp/snapshot.json'))
          assert payload.get('v') == 1
          assert len(rows) > 100000
          assert all(isinstance(r,list) and len(r)==8 for r in rows[:1000])
          PY

          echo 'NATIONAL_STATIC_SNAPSHOT_OK'
