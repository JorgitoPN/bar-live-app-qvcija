name: Map national snapshot contract

on:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/map-national-snapshot-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure national snapshot
        shell: bash
        run: |
          set -euo pipefail
          API='https://barlive-api.onrender.com/api/map'
          echo '--- /tiles/status ---'
          status_code="$(curl --silent --show-error --compressed --connect-timeout 15 --max-time 60 -o /tmp/status.txt -w '%{http_code}' "$API/tiles/status")"
          echo "TILES_STATUS_HTTP=$status_code"
          cat /tmp/status.txt
          echo
          echo '--- /national-snapshot-manifest.json ---'
          manifest_result="$(curl --silent --show-error --compressed --connect-timeout 15 --max-time 120 -o /tmp/manifest.json -w '%{http_code} %{time_total}' "$API/national-snapshot-manifest.json")"
          echo "NATIONAL_MANIFEST_RESULT=$manifest_result"
          cat /tmp/manifest.json
          echo
          manifest_code="$(printf '%s' "$manifest_result" | awk '{print $1}')"
          if [ "$manifest_code" != "200" ]; then
            exit 1
          fi
          jq -e '.count > 100000' /tmp/manifest.json >/dev/null

          snapshot_seconds="$(curl --fail --silent --show-error --compressed             --connect-timeout 15 --max-time 180             --write-out '%{time_total}'             --output /tmp/snapshot.json             "$API/national-markers.json?v=2")"
          python - <<'PY'
          import json, os
          with open('/tmp/snapshot.json', encoding='utf-8') as f:
              payload=json.load(f)
          rows=payload.get('rows') or []
          print('NATIONAL_SNAPSHOT_VERSION=', payload.get('v'))
          print('NATIONAL_SNAPSHOT_COUNT=', len(rows))
          print('NATIONAL_SNAPSHOT_JSON_BYTES=', os.path.getsize('/tmp/snapshot.json'))
          assert len(rows) > 100000, len(rows)
          assert all(isinstance(r,list) and len(r)==6 for r in rows[:1000])
          states={0:0,1:0,2:0}
          for r in rows:
              states[int(r[5])]=states.get(int(r[5]),0)+1
          print('NATIONAL_STATE_COUNTS=', states)
          PY
          echo "NATIONAL_SNAPSHOT_SECONDS=$snapshot_seconds"
