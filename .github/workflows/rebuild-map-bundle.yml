name: Rebuild BarLive map bundle

on:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/rebuild-map-bundle.yml'
      - 'scripts/barlive-single-source-map-template.html'
      - 'scripts/patch-map-bundle.mjs'

permissions:
  contents: write

concurrency:
  group: barlive-map-bundle
  cancel-in-progress: true

jobs:
  rebuild-map-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Replace legacy map runtime
        run: node scripts/patch-map-bundle.mjs

      - name: Commit compiled bundle
        run: |
          if git diff --quiet -- _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js; then
            echo "Bundle already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          git commit -m "build(map): publish single-source runtime [map-bundle-built]"
          git push origin HEAD:gh-pages
