name: Inspect current BarLive production bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-current-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Inspect minimap module 1253
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const bundle = cp.execSync("find _expo/static/js/web -maxdepth 1 -type f -name 'entry-*.js' | head -n 1", {encoding:'utf8'}).trim();
          const code = fs.readFileSync(bundle, 'utf8');
          const desktopEnd = code.indexOf('},1252,[');
          console.log('DESKTOP_END', desktopEnd);
          const start = code.indexOf('__d(function', desktopEnd + 1);
          const end = code.indexOf('},1253,[', start);
          console.log('START', start, 'END', end, 'LEN', end-start);
          console.log(code.slice(start, end > start ? end + 500 : start + 90000));
          NODE
