name: Inspect current BarLive production bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-current-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Inspect canonical map component boundaries
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const bundle = cp.execSync("find _expo/static/js/web -maxdepth 1 -type f -name 'entry-*.js' | head -n 1", {encoding:'utf8'}).trim();
          const code = fs.readFileSync(bundle,'utf8');
          const p = code.indexOf('map_popup_request');
          const start = code.lastIndexOf('__d(function', p);
          const close = code.indexOf(');\n__d(function', p);
          const end = close > 0 ? close + 2 : code.length;
          const module = code.slice(start,end);
          const idMatch = module.match(/\},(\d+),\[[^\]]*\]\);$/);
          console.log('START',start,'END',end,'LEN',module.length,'ID',idMatch&&idMatch[1]);
          console.log('\nHEAD\n'+module.slice(0,16000));
          console.log('\nTAIL\n'+module.slice(-16000));
          NODE
