name: Inspect current BarLive production bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-current-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Identify canonical map module
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const bundle = cp.execSync("find _expo/static/js/web -maxdepth 1 -type f -name 'entry-*.js' | head -n 1", {encoding:'utf8'}).trim();
          const code = fs.readFileSync(bundle, 'utf8');
          const needles=['map_popup_request','[MAP_RENDER][HYBRID_FALLBACK]','window.showPopupFromNative'];
          for(const needle of needles){
            let p=0,n=0;
            while((p=code.indexOf(needle,p))>=0 && n<20){
              const start=code.lastIndexOf('__d(function',p);
              const close=code.indexOf(');\n__d(function',p);
              const chunk=close>p?code.slice(Math.max(start,close-400),close+2):'';
              const m=chunk.match(/\},(\d+),\[[^\]]*\]\);?$/);
              console.log('MATCH',needle,n,'POS',p,'START',start,'CLOSE',close,'MODULE',m&&m[1]);
              console.log(code.slice(start,Math.min(start+1800,p)));
              p+=needle.length;n++;
            }
          }
          NODE
