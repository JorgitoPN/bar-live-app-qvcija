name: Inspect current BarLive production bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-current-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Inspect desktop minimap module
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const bundle = cp.execSync("find _expo/static/js/web -maxdepth 1 -type f -name 'entry-*.js' | head -n 1", {encoding:'utf8'}).trim();
          const code = fs.readFileSync(bundle, 'utf8');
          const needles = ['onVenuePress','mapLegend','selectedCategory:j','center:N'];
          for (const needle of needles) {
            let p=0, n=0;
            while ((p=code.indexOf(needle,p)) >= 0 && n < 20) {
              console.log('\n===== '+needle+' #'+n+' @ '+p+' =====');
              console.log(code.slice(Math.max(0,p-10000), Math.min(code.length,p+14000)));
              p += needle.length; n++;
            }
          }
          NODE
