name: Inspect compiled map filter module

on:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/inspect-map-filter-module.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout bundle
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          sparse-checkout: |
            _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          sparse-checkout-cone-mode: false
      - name: Print exact filter render expressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('_expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js').read_text(encoding='utf-8')
          for needle in [
              'g=s(n(o[9]))',
              '[me,fe]=(0,l.useState)(!1)',
              'xe=(0,l.useCallback)',
              'onClose:Se',
              'visible:me'
          ]:
              i=s.find(needle, 2800000)
              print('\nNEEDLE',needle,'INDEX',i)
              if i>=0:
                  print(s[max(0,i-1400):min(len(s),i+2600)])
          PY
