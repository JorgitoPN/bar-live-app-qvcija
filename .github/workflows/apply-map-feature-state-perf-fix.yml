name: Apply BarLive map feature-state performance fix

on:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/apply-map-feature-state-perf-fix.yml'
      - '.github/scripts/apply-map-feature-state-perf-fix.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-production-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Patch canonical map bundle
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/apply-map-feature-state-perf-fix.js
          grep -Fq 'if (!advancedFilterActive) return;' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq 'liveIds.forEach(function(id)' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq 'promoIds.forEach(function(id)' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq 'canonical-map-v5-zoom-perf-5a49816-20260926' index.html
          grep -Fq 'minzoom:13' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js

      - name: Commit production performance fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No production changes needed.'
            exit 0
          fi
          git add _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js \
            index.html 404.html explorar/mapa/index.html sw.js
          git add explorar/index.html detalle/local/index.html 2>/dev/null || true
          git commit -m 'perf(web-map): avoid full-source feature-state rewrites'
          git push origin gh-pages
