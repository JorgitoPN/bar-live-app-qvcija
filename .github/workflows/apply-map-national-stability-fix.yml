name: Apply BarLive map national stability fix

on:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/apply-map-national-stability-fix.yml'
      - '.github/scripts/apply-map-national-stability-fix.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-production-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Patch canonical map bundle
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/apply-map-national-stability-fix.js
          grep -Fq 'canonical-map-v9-national-stable-995dd7f-20260926' index.html
          grep -Fq 'sourceLabel === "state-refresh-local"' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq 'activeDatasetMode === "national-static"' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq '/sw.js?v=22' index.html
          grep -Fq 'canonical-map-v9-national-stable' version.json

      - name: Commit v9 production bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No production changes needed.'
            exit 0
          fi
          git add _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js \
            index.html 404.html explorar/mapa/index.html sw.js version.json
          git add explorar/index.html detalle/local/index.html 2>/dev/null || true
          git commit -m 'fix(web-map): throttle repeated national state refreshes'
          git push origin gh-pages
