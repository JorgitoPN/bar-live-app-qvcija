name: LEGACY — Build public source to gh-pages

on:
  workflow_dispatch:
    inputs:
      confirm_stale_public_source:
        description: "Type DEPLOY_STALE_PUBLIC_SOURCE only if the public source has been manually resynced with Barlive-2/main."
        required: true
        default: ""

permissions:
  contents: write

concurrency:
  group: barlive-gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: ${{ inputs.confirm_stale_public_source == 'DEPLOY_STALE_PUBLIC_SOURCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refuse known stale public source
        run: |
          set -euo pipefail
          test -f "app/(tabs)/explorar/mapa.tsx"
          grep -Fq "MapFrame" "app/(tabs)/explorar/mapa.tsx" || {
            echo "::error::Public main is not synchronized with canonical Barlive-2/main. Refusing to overwrite production."
            exit 1
          }


      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Clean tracked node_modules
        run: rm -rf node_modules

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages base path
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.experiments = {
            ...(app.expo.experiments || {}),
            baseUrl: '/'
          };
          app.expo.web = {
            ...(app.expo.web || {}),
            output: 'single',
            bundler: 'metro'
          };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Export Expo web
        env:
          EXPO_NO_TELEMETRY: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build:web

      - name: Prepare custom-domain static site
        run: |
          cp dist/index.html dist/404.html
          for route in explorar explorar/mapa detalle/local; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          touch dist/.nojekyll
          printf 'barliveapp.es\n' > dist/CNAME

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
