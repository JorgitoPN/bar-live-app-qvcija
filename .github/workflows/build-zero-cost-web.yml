name: Build zero-cost BarLive web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barlive-gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Clean tracked node_modules
        run: rm -rf node_modules

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages base path
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.experiments = {
            ...(app.expo.experiments || {}),
            baseUrl: '/'
          };
          app.expo.web = {
            ...(app.expo.web || {}),
            output: 'single',
            bundler: 'metro'
          };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Export Expo web
        env:
          EXPO_NO_TELEMETRY: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build:web

      - name: Prepare custom-domain static site
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'dist/index.html';
          let html = fs.readFileSync(path, 'utf8');
          const buildMarker = '<meta name="barlive-build" content="source-fix-2026-09-25-1">';
          const logoFix = `<script id="barlive-logo-fix">(function(){var s="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22168%22 height=%2248%22 viewBox=%220 0 168 48%22%3E%3Crect x=%220%22 y=%224%22 width=%2240%22 height=%2240%22 rx=%2212%22 fill=%22%23641B73%22/%3E%3Ctext x=%2220%22 y=%2231%22 text-anchor=%22middle%22 font-family=%22Arial,sans-serif%22 font-size=%2223%22 font-weight=%22900%22 fill=%22white%22%3EB%3C/text%3E%3Ctext x=%2252%22 y=%2231%22 font-family=%22Arial,sans-serif%22 font-size=%2224%22 font-weight=%22800%22 fill=%22%23641B73%22%3EBarLive%3C/text%3E%3C/svg%3E";function p(){document.querySelectorAll('img[alt="BarLive"]').forEach(function(i){if(i.getAttribute("src")!==s){i.setAttribute("src",s);i.style.objectFit="contain";i.style.objectPosition="left center"}})}if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",p,{once:true})}else{p()}new MutationObserver(p).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:["src"]})})();</script>`;
          if (!html.includes('name="barlive-build"')) {
            html = html.replace('</head>', buildMarker + '</head>');
          }
          if (!html.includes('id="barlive-logo-fix"')) {
            html = html.replace('</body>', logoFix + '</body>');
          }
          fs.writeFileSync(path, html);
          NODE
          cp dist/index.html dist/404.html
          for route in explorar explorar/mapa detalle/local; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          touch dist/.nojekyll
          printf 'barliveapp.es\n' > dist/CNAME

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
