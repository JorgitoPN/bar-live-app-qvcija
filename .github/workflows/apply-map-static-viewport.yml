name: Apply BarLive static viewport markers

on:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/apply-map-static-viewport.yml'
      - '.github/scripts/apply-map-static-viewport.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - name: Patch static viewport runtime
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/apply-map-static-viewport.js
          grep -Fq 'canonical-map-v12-static-viewport-90eed08-20260926' index.html
          grep -Fq 'VIEWPORT_TILE_ROOT' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq '[MAP_RENDER][VIEWPORT_STATIC_FETCH]' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq 'viewport-static' _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js
          grep -Fq '/sw.js?v=25' index.html
          grep -Fq 'canonical-map-v12-static-viewport' version.json
      - name: Commit v12 production bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No production changes needed.'
            exit 0
          fi
          git add _expo/static/js/web/entry-4861ff6021ef28fe62f6df13f1490bc8.js \
            index.html 404.html explorar/mapa/index.html sw.js version.json
          git add explorar/index.html detalle/local/index.html 2>/dev/null || true
          git commit -m 'perf(web-map): serve viewport markers from static CDN tiles'
          git push origin gh-pages
