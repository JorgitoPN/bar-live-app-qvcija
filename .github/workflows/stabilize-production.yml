name: Stabilize BarLive production web

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

concurrency:
  group: barlive-stable-production
  cancel-in-progress: false

jobs:
  stabilize:
    if: ${{ !contains(github.event.head_commit.message, '[stable-web-v43]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Patch production bundle and shell
        run: node .github/scripts/stabilize-production.js

      - name: Verify production invariants
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$(find _expo/static/js/web -maxdepth 1 -type f -name 'entry-*.js' | head -n 1)"
          grep -Fq '__BARLIVE_STABLE_WEB_V43__' "$BUNDLE"
          grep -Fq 'R=e/Math.max(h,1),D=e>=1280&&h>=650&&R>=1.45' "$BUNDLE"
          grep -Fq "L||e.splice(0,e.length,...e.filter" "$BUNDLE"

          for HTML in index.html 404.html; do
            grep -Fq 'stable-web-v44-20260926' "$HTML"
            grep -Fq 'barlive-cache-reset-v43' "$HTML"
            grep -Fq 'barlive-header-stretch-v44' "$HTML"
            grep -Fq 'barlive-route-guard-v43' "$HTML"
            ! grep -Fq 'barlive-header-span-v43' "$HTML"
            ! grep -Fq 'barlive-header-backdrop-v43' "$HTML"
            ! grep -Fq 'barlive-web-desktop-ui-' "$HTML"
            ! grep -Fq 'barlive-web-rbac-guest-guard' "$HTML"
            ! grep -Fq 'serviceWorker.register' "$HTML"
          done

      - name: Commit stabilized production
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JorgitoPN"
          git config user.email "jorgepereznoyagh@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Production already stabilized."
            exit 0
          fi
          git commit -m "fix(web): stabilize responsive production [stable-web-v43]"
          git push origin gh-pages
