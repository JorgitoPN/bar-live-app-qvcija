<body>

<script>
(function(){
"use strict";

var VENUE_SOURCE = "barlive-venues";
var VENUE_LAYER = "barlive-venues-circle";
var ICON_LAYER = "barlive-venues-icon";
var LIVE_LAYER = "barlive-venues-live";
var UPCOMING_LAYER = "barlive-venues-upcoming";
var PROMO_LAYER = "barlive-venues-promo";

// v23 hybrid renderer.
// Normal map browsing is served entirely from shared static Mapbox Vector
// Tiles. MapLibre overzooms the z9 source at street level, so even close zoom
// behaves like an interactive "image" while preserving clicks, filters,
// category glyphs and locally-computed schedule colours. The canonical GeoJSON
// renderer remains only as a defensive/advanced-filter fallback.
var HYBRID_SOURCE = "barlive-hybrid-venues";
var HYBRID_LAYER = "barlive-hybrid-venues-circle";
var HYBRID_ICON_LAYER = "barlive-hybrid-venues-icon";
var HYBRID_TILE_ROOT = "https://barliveapp.es/map-data/hybrid-mvt-v1";
var HYBRID_MANIFEST_URL = HYBRID_TILE_ROOT + "/manifest.json";
var HYBRID_TILE_URL =
  HYBRID_TILE_ROOT +
  "/{z}/{x}/{y}.pbf?v=6a75a4bbf07da418";
// Map maxZoom is 20. A switch above that keeps the static MVT renderer active
// for every normal zoom and lets MapLibre overzoom immutable z9 tiles.
var HYBRID_SWITCH_ZOOM = 21;
var HYBRID_SOURCE_MAX_ZOOM = 9;

var VENUE_DATA_URL = "https://embntaqwlwmgazvrglaf.supabase.co/rest/v1/locales";
var NATIONAL_SNAPSHOT_URL = "https://barliveapp.es/map-data/national-venues-v1.json";
var NATIONAL_SNAPSHOT_MAX_ZOOM = 7;
var VIEWPORT_TILE_ROOT = "https://barliveapp.es/map-data/viewport-z9-v1";
var VIEWPORT_TILE_Z = 9;
var VIEWPORT_TILE_MIN_MAP_ZOOM = 10;
var VIEWPORT_TILE_MAX_REQUESTS = 36;
var NATIONAL_COVERAGE = {
  south:27.45,
  west:-18.25,
  north:44.25,
  east:4.60
};
var NATIONAL_CATEGORY_BY_CODE = [
  "bar",
  "restaurante",
  "cafeteria",
  "pub",
  "discoteca",
  "cocteleria"
];
var DATA_APIKEY = "sb_publishable_ffrXoLqKentwGrBXq3ZTDg_WxsX2y_2";
var DATA_PAGE_SIZE = 1000;
var DATA_PAGE_BATCH = 6;
var DATA_MAX_ROWS = 150000;
var DATA_CACHE_KEY = "barlive-visible-venues-v3-schedules";
var DATA_CACHE_MAX_AGE = 10 * 60 * 1000;
var VIEWPORT_PADDING_RATIO = 0.45;

var map = null;
var activeVenueById = new Map();
var activeRows = [];
var activeCoverage = null;
var activeDatasetGeneration = 0;
var activeDatasetMode = "none";
var nationalSnapshotCompact = null;
var viewportTileManifest = null;
var viewportTileCache = new Map();
var startupPrewarmPromise = null;
var lastNationalStateRefreshAt = 0;
var requestGeneration = 0;
var requestAbortController = null;
var viewportRequestInFlight = false;
var requestTimer = null;
var refreshTimer = null;
var lastRequestReason = "none";
var rendererMode = "hybrid";
var hybridTileFailed = false;
var hybridStateBySid = new Map();
var hybridStateRefreshTimer = null;
var hybridManifestPromise = null;

var stateFilterMode = "todos";
var categoryFilter = "todas";

var advancedCriteria = {};
var advancedFilterActive = false;
var advancedAllowedIds = null;
var advancedGeneration = 0;

var userMarker = null;
var liveIds = new Set();
var upcomingIds = new Set();
var promoIds = new Set();
var promoById = {};

function post(type, payload) {
  try {
    window.ReactNativeWebView.postMessage(
      JSON.stringify(Object.assign({type:type}, payload || {}))
    );
  } catch (_) {}
}

function canonicalCategory(value) {
  var raw = String(value || "").trim().toLowerCase();
  if (raw === "cafe" || raw === "cafes") return "cafeteria";
  if (raw === "restaurant" || raw === "restaurants") return "restaurante";
  if (raw === "nightclub" || raw === "night_club") return "discoteca";
  if (raw === "cocktail" || raw === "cocktail_bar" || raw === "cocktailbar") return "cocteleria";
  if (
    raw === "bar" ||
    raw === "restaurante" ||
    raw === "cafeteria" ||
    raw === "pub" ||
    raw === "discoteca" ||
    raw === "cocteleria"
  ) return raw;
  return "";
}

function categoryFromRow(row) {
  var primary = canonicalCategory(row && (row.tipo || row.barlive_type));
  if (primary) return primary;

  var values = row && row.barlive_types;
  if (Array.isArray(values)) {
    for (var i = 0; i < values.length; i += 1) {
      var candidate = canonicalCategory(values[i]);
      if (candidate) return candidate;
    }
  }

  return "";
}

function normalizeMarkerState(value) {
  var raw = String(value == null ? "" : value).trim().toLowerCase();
  var numeric = Number(value);
  if (raw === "abierto" || raw === "open" || numeric === 1) return "open";
  if (raw === "cerrado" || raw === "closed" || numeric === 2) return "closed";
  return "unknown";
}

function madridClockParts() {
  var fallback=new Date();
  try {
    var parts=new Intl.DateTimeFormat("en-US",{
      timeZone:"Europe/Madrid",
      weekday:"short",
      hour:"2-digit",
      minute:"2-digit",
      hourCycle:"h23"
    }).formatToParts(fallback);
    var values={};
    parts.forEach(function(part) {
      if (part.type!=="literal") values[part.type]=part.value;
    });
    var dayMap={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
    var dayIndex=dayMap[String(values.weekday||"").slice(0,3)];
    var hour=Number(values.hour);
    var minute=Number(values.minute);
    if (
      Number.isFinite(dayIndex) &&
      Number.isFinite(hour) &&
      Number.isFinite(minute)
    ) {
      return {dayIndex:dayIndex,minutes:hour*60+minute};
    }
  } catch (_) {}

  // Fallback only for runtimes without Intl timezone support.
  var fallbackDay=(fallback.getDay()+6)%7;
  return {
    dayIndex:fallbackDay,
    minutes:fallback.getHours()*60+fallback.getMinutes()
  };
}

function normalizeScheduleDayKey(value) {
  var raw=String(value||"")
    .normalize("NFD")
    .replace(/[\\u0300-\\u036f]/g,"")
    .replace(/\\./g,"")
    .trim()
    .toLowerCase();

  var aliases={
    lunes:0,monday:0,mon:0,mo:0,
    martes:1,tuesday:1,tue:1,tu:1,
    miercoles:2,wednesday:2,wed:2,we:2,
    jueves:3,thursday:3,thu:3,th:3,
    viernes:4,friday:4,fri:4,fr:4,
    sabado:5,saturday:5,sat:5,sa:5,
    domingo:6,sunday:6,sun:6,su:6
  };
  return Object.prototype.hasOwnProperty.call(aliases,raw)
    ? aliases[raw]
    : null;
}

function normalizeScheduleRanges(value) {
  if (Array.isArray(value)) {
    return value
      .map(function(item){return String(item==null?"":item).trim();})
      .filter(Boolean);
  }

  if (typeof value==="string") {
    var text=value.trim();
    if (!text) return [];
    if (text.indexOf(";")>=0) {
      return text.split(";").map(function(item){return item.trim();}).filter(Boolean);
    }
    if (text.indexOf(",")>=0) {
      return text.split(",").map(function(item){return item.trim();}).filter(Boolean);
    }
    return [text];
  }

  return [];
}

function parseScheduleRange(value) {
  var normalized=String(value||"")
    .trim()
    .toLowerCase()
    .replace(/–/g,"-")
    .replace(/—/g,"-");

  if (!normalized || normalized==="cerrado" || normalized==="closed" || normalized==="off") {
    return null;
  }

  if (
    normalized==="24 horas" ||
    normalized==="24h" ||
    normalized==="abierto 24 horas" ||
    normalized==="open 24 hours" ||
    normalized==="24/7" ||
    normalized==="00:00-24:00" ||
    normalized==="00:00-23:59" ||
    normalized==="00:00-00:00" ||
    normalized.indexOf("abierto 24")>=0 ||
    normalized.indexOf("open 24")>=0
  ) {
    return [0,1440];
  }

  var match=normalized.match(
    /^([0-9]{1,2}):([0-9]{2})\\s*-\\s*([0-9]{1,2}):([0-9]{2})$/
  );
  if (!match) return null;

  var openHour=Number(match[1]);
  var openMinute=Number(match[2]);
  var closeHour=Number(match[3]);
  var closeMinute=Number(match[4]);

  if (
    openHour>23 || openMinute>59 ||
    closeHour>24 || closeMinute>59 ||
    (closeHour===24 && closeMinute!==0)
  ) return null;

  var openMinutes=openHour*60+openMinute;
  var closeMinutes=closeHour===24 ? 1440 : closeHour*60+closeMinute;
  if (openMinutes===0 && closeMinutes===0) closeMinutes=1440;
  return [openMinutes,closeMinutes];
}

function emptyWeeklySchedule() {
  return [
    {known:false,ranges:[]},
    {known:false,ranges:[]},
    {known:false,ranges:[]},
    {known:false,ranges:[]},
    {known:false,ranges:[]},
    {known:false,ranges:[]},
    {known:false,ranges:[]}
  ];
}

function weeklyScheduleFromBarLive(value) {
  var hours=value;
  if (typeof hours==="string") {
    try { hours=JSON.parse(hours); }
    catch (_) { return null; }
  }

  if (!hours || typeof hours!=="object" || Array.isArray(hours)) return null;

  var days=emptyWeeklySchedule();
  var recognized=false;

  Object.keys(hours).forEach(function(key) {
    var dayIndex=normalizeScheduleDayKey(key);
    if (dayIndex===null) return;

    var ranges=normalizeScheduleRanges(hours[key]);
    if (!ranges.length) return;

    recognized=true;
    days[dayIndex].known=true;
    ranges.forEach(function(rawRange) {
      var parsed=parseScheduleRange(rawRange);
      if (parsed) days[dayIndex].ranges.push(parsed);
    });
  });

  return recognized ? days : null;
}

function expandOsmDaySpec(spec) {
  var codeToDay={Mo:0,Tu:1,We:2,Th:3,Fr:4,Sa:5,Su:6};
  var result=new Set();

  String(spec||"").split(",").forEach(function(token) {
    token=token.trim();
    if (!token) return;

    if (token.indexOf("-")>=0) {
      var parts=token.split("-").map(function(item){return item.trim();});
      var start=codeToDay[parts[0]];
      var end=codeToDay[parts[1]];
      if (start==null || end==null) return;

      var day=start;
      for (var guard=0;guard<7;guard+=1) {
        result.add(day);
        if (day===end) break;
        day=(day+1)%7;
      }
      return;
    }

    if (codeToDay[token]!=null) result.add(codeToDay[token]);
  });

  return Array.from(result);
}

function weeklyScheduleFromOsm(value) {
  var text=String(value||"").trim();
  if (!text) return null;

  if (/^24\\s*\\/\\s*7$/i.test(text)) {
    var always=emptyWeeklySchedule();
    always.forEach(function(day) {
      day.known=true;
      day.ranges=[[0,1440]];
    });
    return always;
  }

  var days=emptyWeeklySchedule();
  var recognized=false;

  text
    .replace(/–/g,"-")
    .replace(/—/g,"-")
    .split(";")
    .forEach(function(clause) {
      clause=clause.replace(/"[^"]*"/g,"").trim();
      if (!clause) return;

      var match=clause.match(
        /^((?:Mo|Tu|We|Th|Fr|Sa|Su)(?:\\s*[-,]\\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))*)\\s+(.+)$/i
      );
      if (!match) return;

      var normalizedSpec=match[1].replace(/\\s+/g,"");
      normalizedSpec=normalizedSpec.replace(/mo/ig,"Mo")
        .replace(/tu/ig,"Tu")
        .replace(/we/ig,"We")
        .replace(/th/ig,"Th")
        .replace(/fr/ig,"Fr")
        .replace(/sa/ig,"Sa")
        .replace(/su/ig,"Su");

      var dayIndexes=expandOsmDaySpec(normalizedSpec);
      if (!dayIndexes.length) return;

      var rule=String(match[2]||"").trim();
      if (/^(off|closed)$/i.test(rule)) {
        recognized=true;
        dayIndexes.forEach(function(dayIndex) {
          days[dayIndex].known=true;
        });
        return;
      }

      if (/^(open|24\\s*\\/\\s*7)$/i.test(rule)) {
        recognized=true;
        dayIndexes.forEach(function(dayIndex) {
          days[dayIndex].known=true;
          days[dayIndex].ranges.push([0,1440]);
        });
        return;
      }

      var parsedRanges=[];
      var rangeRegex=/([0-9]{1,2}):([0-9]{2})\\s*-\\s*([0-9]{1,2}):([0-9]{2})/g;
      var rangeMatch;
      while ((rangeMatch=rangeRegex.exec(rule))!==null) {
        var parsed=parseScheduleRange(
          rangeMatch[1]+":"+rangeMatch[2]+"-"+rangeMatch[3]+":"+rangeMatch[4]
        );
        if (parsed) parsedRanges.push(parsed);
      }

      if (!parsedRanges.length) return;

      recognized=true;
      dayIndexes.forEach(function(dayIndex) {
        days[dayIndex].known=true;
        Array.prototype.push.apply(days[dayIndex].ranges,parsedRanges);
      });
    });

  return recognized ? days : null;
}

function markerStateFromWeeklySchedule(days,clock) {
  if (!days || !clock) return "unknown";

  var today=days[clock.dayIndex] || {known:false,ranges:[]};
  var previous=days[(clock.dayIndex+6)%7] || {known:false,ranges:[]};
  var nowMinutes=clock.minutes;

  for (var i=0;i<today.ranges.length;i+=1) {
    var current=today.ranges[i];
    var openMinutes=current[0];
    var closeMinutes=current[1];

    if (openMinutes===0 && closeMinutes===1440) return "open";
    if (
      openMinutes<closeMinutes &&
      nowMinutes>=openMinutes &&
      nowMinutes<closeMinutes
    ) return "open";
    if (
      openMinutes>closeMinutes &&
      nowMinutes>=openMinutes
    ) return "open";
  }

  for (var j=0;j<previous.ranges.length;j+=1) {
    var prior=previous.ranges[j];
    if (
      prior[0]>prior[1] &&
      nowMinutes<prior[1]
    ) return "open";
  }

  return today.known ? "closed" : "unknown";
}

function deriveRealtimeMarkerState(row,clock) {
  var businessStatus=String(
    row && (row.google_business_status || row.estado_negocio) || ""
  ).trim().toUpperCase();

  if (
    businessStatus==="CLOSED_PERMANENTLY" ||
    businessStatus==="CLOSED_TEMPORARILY"
  ) return {state:"closed",source:"business-status"};

  // Only schedules that BarLive can present as real venue hours may colour a
  // marker. OSM opening_hours remains enrichment input, not an "open now"
  // source while the venue UI says it has no schedule information.
  var barliveSchedule=weeklyScheduleFromBarLive(
    row && row.horarios_completos
  );
  var state=markerStateFromWeeklySchedule(barliveSchedule,clock);
  if (state!=="unknown") {
    return {state:state,source:"barlive-schedule"};
  }

  return {state:"unknown",source:"none"};
}

function applyRealtimeScheduleStates(rows) {
  var clock=madridClockParts();
  var knownStates=0;
  var barliveStates=0;
  var osmStates=0;
  var businessStates=0;

  var merged=(Array.isArray(rows)?rows:[]).map(function(row) {
    if (!row || typeof row!=="object") return row;
    var result=deriveRealtimeMarkerState(row,clock);

    if (result.state!=="unknown") knownStates+=1;
    if (result.source==="barlive-schedule") barliveStates+=1;
    else if (result.source==="osm-opening-hours") osmStates+=1;
    else if (result.source==="business-status") businessStates+=1;

    return Object.assign({},row,{estado:result.state});
  });

  return {
    rows:merged,
    knownStates:knownStates,
    barliveStates:barliveStates,
    osmStates:osmStates,
    businessStates:businessStates
  };
}

function normalizeVenueRow(row) {
  if (!row || typeof row !== "object") return null;
  var id = String(row.local_id || row.id || "").trim();
  var lat = Number(row.latitud != null ? row.latitud : row.lat);
  var lng = Number(
    row.longitud != null ? row.longitud :
    row.lng != null ? row.lng :
    row.lon
  );

  if (!id || !isFinite(lat) || !isFinite(lng)) return null;
  if (lat < -85 || lat > 85 || lng < -180 || lng > 180) return null;

  var category = categoryFromRow(row);
  if (!category) return null;

  return {
    id:id,
    latitude:lat,
    longitude:lng,
    category:category,
    markerState:normalizeMarkerState(row.estado),
    featured:row.destacado === true || Number(row.destacado || 0) === 1
  };
}

function rowsToFeatureCollection(rows) {
  var byId = new Map();
  var duplicateVenueIds = 0;
  var coordinateOwner = new Map();
  var nearCoordinatePairs = 0;

  (Array.isArray(rows) ? rows : []).forEach(function(row) {
    var venue = normalizeVenueRow(row);
    if (!venue) return;

    if (byId.has(venue.id)) {
      duplicateVenueIds += 1;
      return;
    }
    byId.set(venue.id, venue);

    // Diagnostic only: never hide different real ids just because coordinates
    // are extremely close. That would conceal a database duplication problem.
    var coordinateKey =
      venue.latitude.toFixed(5) + ":" + venue.longitude.toFixed(5);
    var existingId = coordinateOwner.get(coordinateKey);
    if (existingId && existingId !== venue.id) nearCoordinatePairs += 1;
    else coordinateOwner.set(coordinateKey, venue.id);
  });

  var features = [];
  byId.forEach(function(venue) {
    features.push({
      type:"Feature",
      id:venue.id,
      geometry:{
        type:"Point",
        coordinates:[venue.longitude, venue.latitude]
      },
      properties:{
        venueId:venue.id,
        id:venue.id,
        category:venue.category,
        tipo:venue.category,
        markerState:venue.markerState,
        destacado:venue.featured
      }
    });
  });

  return {
    collection:{type:"FeatureCollection",features:features},
    byId:byId,
    duplicateVenueIds:duplicateVenueIds,
    nearCoordinatePairs:nearCoordinatePairs
  };
}

function getCurrentBounds() {
  if (!map) return null;
  var bounds = map.getBounds();
  return {
    south:Number(bounds.getSouth()),
    west:Number(bounds.getWest()),
    north:Number(bounds.getNorth()),
    east:Number(bounds.getEast())
  };
}

function boundsContain(outer, inner) {
  if (!outer || !inner) return false;
  var epsilon = 0.000001;
  return (
    inner.south >= outer.south - epsilon &&
    inner.west >= outer.west - epsilon &&
    inner.north <= outer.north + epsilon &&
    inner.east <= outer.east + epsilon
  );
}

function paddedBounds(bounds) {
  var latSpan = Math.max(0.001, bounds.north - bounds.south);
  var lngSpan = Math.max(0.001, bounds.east - bounds.west);
  var latPad = Math.max(0.015, latSpan * VIEWPORT_PADDING_RATIO);
  var lngPad = Math.max(0.015, lngSpan * VIEWPORT_PADDING_RATIO);

  return {
    south:Math.max(27.45, bounds.south - latPad),
    west:Math.max(-18.25, bounds.west - lngPad),
    north:Math.min(44.25, bounds.north + latPad),
    east:Math.min(4.60, bounds.east + lngPad)
  };
}

function shouldUseHybridRenderer() {
  return !!(
    map &&
    Number(map.getZoom()) < HYBRID_SWITCH_ZOOM &&
    !advancedFilterActive &&
    !hybridTileFailed
  );
}

function hybridCategoryCode(value) {
  return NATIONAL_CATEGORY_BY_CODE.indexOf(canonicalCategory(value));
}

function hybridFilterExpression() {
  var expression = ["all"];

  if (categoryFilter !== "todas") {
    var code=hybridCategoryCode(categoryFilter);
    if (code>=0) {
      expression.push(["==",["get","t"],code]);
    }
  }

  return expression;
}

function hybridOpacityExpression() {
  if (stateFilterMode !== "no_cerrados") return 1;
  return [
    "case",
    [
      "==",
      ["string",["feature-state","markerState"],"unknown"],
      "open"
    ],
    1,
    0
  ];
}

function parseHybridScheduleValue(value) {
  if (value==null) return null;
  if (typeof value!=="string") return value;
  var text=value.trim();
  if (!text) return null;
  if (
    (text.charAt(0)==="{" && text.charAt(text.length-1)==="}") ||
    (text.charAt(0)==="[" && text.charAt(text.length-1)==="]")
  ) {
    try { return JSON.parse(text); } catch (_) {}
  }
  return text;
}

function hybridScheduleRow(feature) {
  var props=feature && feature.properties || {};
  return {
    horarios_completos:parseHybridScheduleValue(props.h),
    google_business_status:props.b==null ? null : String(props.b),
    osm_opening_hours:props.o==null ? null : String(props.o)
  };
}

function refreshHybridVisibleStates(reason) {
  if (!map || !map.getSource(HYBRID_SOURCE)) return;

  var features=[];
  try {
    features=map.querySourceFeatures(
      HYBRID_SOURCE,
      {sourceLayer:"locales"}
    ) || [];
  } catch (_) {
    return;
  }

  if (!features.length) return;

  var clock=madridClockParts();
  var bySid=new Map();

  features.forEach(function(feature) {
    var props=feature && feature.properties || {};
    var sid=Number(props.s != null ? props.s : feature && feature.id);
    if (!Number.isFinite(sid) || sid<=0) return;

    var hasSchedulePayload =
      props.h!=null &&
      String(props.h).trim()!=="" &&
      String(props.h).trim()!=="{}" &&
      String(props.h).trim()!=="[]";
    var businessStatus=String(props.b==null ? "" : props.b).trim().toUpperCase();
    var hasExplicitClosedStatus =
      businessStatus==="CLOSED_PERMANENTLY" ||
      businessStatus==="CLOSED_TEMPORARILY";

    if (!hasSchedulePayload && !hasExplicitClosedStatus) {
      var previousState=hybridStateBySid.get(sid);
      if (previousState && previousState!=="unknown") {
        hybridStateBySid.set(sid,"unknown");
        try {
          map.setFeatureState(
            {
              source:HYBRID_SOURCE,
              sourceLayer:"locales",
              id:sid
            },
            {markerState:"unknown"}
          );
        } catch (_) {}
      } else if (previousState===undefined) {
        hybridStateBySid.set(sid,"unknown");
      }
      return;
    }

    if (!bySid.has(sid)) bySid.set(sid,feature);
  });

  var entries=Array.from(bySid.entries());
  if (!entries.length) return;

  var index=0;
  var changed=0;
  var batchSize=500;

  function pump() {
    var end=Math.min(entries.length,index+batchSize);

    for (;index<end;index+=1) {
      var pair=entries[index];
      var sid=pair[0];
      var feature=pair[1];
      var result=deriveRealtimeMarkerState(
        hybridScheduleRow(feature),
        clock
      );
      var nextState=normalizeMarkerState(result && result.state);
      var previous=hybridStateBySid.get(sid);

      if (previous===nextState) continue;

      hybridStateBySid.set(sid,nextState);
      try {
        map.setFeatureState(
          {
            source:HYBRID_SOURCE,
            sourceLayer:"locales",
            id:sid
          },
          {markerState:nextState}
        );
        changed+=1;
      } catch (_) {}
    }

    if (index<entries.length) {
      requestAnimationFrame(pump);
      return;
    }

    if (changed>0) {
      console.log(
        "[MAP_RENDER][HYBRID_STATE] reason="+String(reason||"unknown")+
        " loaded="+entries.length+
        " changed="+changed
      );
      scheduleDiagnostics("hybrid-state");
    }
  }

  pump();
}

function scheduleHybridStateRefresh(reason) {
  if (hybridStateRefreshTimer) clearTimeout(hybridStateRefreshTimer);
  hybridStateRefreshTimer=setTimeout(function(){
    hybridStateRefreshTimer=null;
    refreshHybridVisibleStates(reason);
  },45);
}

function prepareHybridStaticManifest() {
  if (hybridManifestPromise) return hybridManifestPromise;

  hybridManifestPromise=fetch(HYBRID_MANIFEST_URL,{
    method:"GET",
    cache:"no-cache",
    headers:{Accept:"application/json"}
  })
    .then(function(response) {
      if (!response.ok) {
        throw new Error("hybrid manifest HTTP "+response.status);
      }
      return response.json();
    })
    .then(function(manifest) {
      if (
        !manifest ||
        Number(manifest.v)!==1 ||
        String(manifest.format||"")!=="mvt" ||
        Number(manifest.rows||0)<100000 ||
        !manifest.tileTemplate
      ) {
        throw new Error("invalid hybrid MVT manifest");
      }

      var template=String(manifest.tileTemplate);
      HYBRID_TILE_URL=template.indexOf("http")===0
        ? template
        : "https://barliveapp.es"+template;

      console.log(
        "[MAP_RENDER][HYBRID_MANIFEST] rows="+Number(manifest.rows||0)+
        " tiles="+Number(manifest.tileCount||0)+
        " bytes="+Number(manifest.totalBytes||0)
      );

      return manifest;
    })
    .catch(function(error) {
      console.warn(
        "[MAP_RENDER][HYBRID_MANIFEST_FALLBACK]",
        String(error && error.message || error)
      );
      return null;
    });

  return hybridManifestPromise;
}

function setLayerVisibility(id,visible) {
  if (!map || !map.getLayer(id)) return;
  try {
    map.setLayoutProperty(id,"visibility",visible ? "visible" : "none");
  } catch (_) {}
}

function setHybridVisibility(visible) {
  setLayerVisibility(HYBRID_LAYER,visible);
  setLayerVisibility(HYBRID_ICON_LAYER,visible);
}

function setCanonicalVisibility(visible) {
  [VENUE_LAYER,ICON_LAYER,LIVE_LAYER,UPCOMING_LAYER,PROMO_LAYER].forEach(function(id) {
    setLayerVisibility(id,visible);
  });
}

function enterHybridTileMode(reason) {
  if (!map || hybridTileFailed || advancedFilterActive) return false;

  rendererMode="hybrid";
  setCanonicalVisibility(false);
  setHybridVisibility(true);

  if (requestAbortController) {
    try { requestAbortController.abort(); } catch (_) {}
    requestAbortController=null;
  }
  viewportRequestInFlight=false;

  console.log(
    "[MAP_RENDER][RENDERER] mode=hybrid reason="+String(reason||"unknown")+
    " zoom="+map.getZoom().toFixed(2)
  );
  scheduleHybridStateRefresh("renderer-"+String(reason||"unknown"));
  return true;
}

function activateCanonicalRenderer(reason) {
  if (!map) return;
  rendererMode="canonical";
  setHybridVisibility(false);
  setCanonicalVisibility(true);
  console.log(
    "[MAP_RENDER][RENDERER] mode=canonical reason="+String(reason||"unknown")+
    " zoom="+map.getZoom().toFixed(2)
  );
}

function datasetFilterExpression() {
  var expression = ["all"];

  if (categoryFilter !== "todas") {
    expression.push([
      "==",
      ["get","category"],
      canonicalCategory(categoryFilter)
    ]);
  }

  if (stateFilterMode === "no_cerrados") {
    expression.push(["==",["get","markerState"],"open"]);
  }

  return expression;
}

function advancedVisibleExpression() {
  // When advanced filters are inactive, ignore any stale feature-state from a
  // previous filter session instead of rewriting every venue back to true.
  if (!advancedFilterActive) return true;
  return ["boolean",["feature-state","advancedVisible"],true];
}

function decoratedFilterExpression(baseFilter,ids) {
  var values=Array.from(ids||[]);
  if (!values.length) {
    return ["all",baseFilter,["==",["get","venueId"],"__barlive_no_match__"]];
  }
  return [
    "all",
    baseFilter,
    ["in",["get","venueId"],["literal",values]]
  ];
}

function applyFilters() {
  if (!map) return;
  var filter = datasetFilterExpression();
  var hybridFilter = hybridFilterExpression();

  if (map.getLayer(HYBRID_LAYER)) {
    map.setFilter(HYBRID_LAYER,hybridFilter);
    var hybridVisibility=hybridOpacityExpression();
    map.setPaintProperty(
      HYBRID_LAYER,
      "circle-opacity",
      hybridVisibility
    );
    map.setPaintProperty(
      HYBRID_LAYER,
      "circle-stroke-opacity",
      hybridVisibility
    );
  }
  if (map.getLayer(HYBRID_ICON_LAYER)) {
    map.setFilter(HYBRID_ICON_LAYER,hybridFilter);
    map.setPaintProperty(
      HYBRID_ICON_LAYER,
      "icon-opacity",
      hybridOpacityExpression()
    );
  }

  // The canonical venue and category-glyph layers see the full filtered
  // dataset. Decorative layers must only inspect venues that are actually
  // decorated; otherwise MapLibre re-evaluates the whole source 3 extra times.
  if (map.getLayer(VENUE_LAYER)) map.setFilter(VENUE_LAYER,filter);
  if (map.getLayer(ICON_LAYER)) map.setFilter(ICON_LAYER,filter);
  if (map.getLayer(LIVE_LAYER)) {
    map.setFilter(LIVE_LAYER,decoratedFilterExpression(filter,liveIds));
  }
  if (map.getLayer(UPCOMING_LAYER)) {
    map.setFilter(UPCOMING_LAYER,decoratedFilterExpression(filter,upcomingIds));
  }
  if (map.getLayer(PROMO_LAYER)) {
    map.setFilter(PROMO_LAYER,decoratedFilterExpression(filter,promoIds));
  }

  var advancedVisible = advancedVisibleExpression();

  if (map.getLayer(VENUE_LAYER)) {
    map.setPaintProperty(
      VENUE_LAYER,
      "circle-opacity",
      ["case",advancedVisible,1,0]
    );
  }

  if (map.getLayer(ICON_LAYER)) {
    map.setPaintProperty(
      ICON_LAYER,
      "icon-opacity",
      ["case",advancedVisible,1,0]
    );
  }

  if (map.getLayer(LIVE_LAYER)) {
    map.setPaintProperty(LIVE_LAYER,"circle-opacity",[
      "case",
      ["all",
        advancedVisible,
        ["==",["string",["feature-state","eventState"],"none"],"live"]
      ],
      0.32,
      0
    ]);
  }

  if (map.getLayer(UPCOMING_LAYER)) {
    map.setPaintProperty(UPCOMING_LAYER,"circle-opacity",[
      "case",
      ["all",
        advancedVisible,
        ["==",["string",["feature-state","eventState"],"none"],"upcoming"]
      ],
      0.20,
      0
    ]);
  }

  if (map.getLayer(PROMO_LAYER)) {
    map.setPaintProperty(PROMO_LAYER,"circle-opacity",[
      "case",
      ["all",
        advancedVisible,
        ["==",["boolean",["feature-state","hasPromo"],false],true]
      ],
      0.25,
      0
    ]);
  }

  scheduleDiagnostics("filter");
}

function setVenueFeatureState(id, patch) {
  if (!map || !map.getSource(VENUE_SOURCE) || !id) return;
  try {
    map.setFeatureState({source:VENUE_SOURCE,id:String(id)},patch);
  } catch (_) {}
}

function applyAdvancedFeatureState() {
  // Default map browsing must never enqueue one feature-state mutation per
  // venue. Missing advancedVisible already means visible.
  if (!advancedFilterActive) return;

  activeVenueById.forEach(function(_venue,id) {
    var visible=!!(advancedAllowedIds && advancedAllowedIds.has(id));
    setVenueFeatureState(id,{advancedVisible:visible});
  });
}

function applyEventFeatureState() {
  // Only decorated venues need feature-state. Writing "none" to every venue
  // creates thousands of unnecessary MapLibre mutations after each setData().
  liveIds.forEach(function(id) {
    if (activeVenueById.has(id)) {
      setVenueFeatureState(id,{eventState:"live"});
    }
  });
  upcomingIds.forEach(function(id) {
    if (!liveIds.has(id) && activeVenueById.has(id)) {
      setVenueFeatureState(id,{eventState:"upcoming"});
    }
  });
}

function applyPromoFeatureState() {
  // Same rule as events: touch only venues that actually have a promotion.
  promoIds.forEach(function(id) {
    if (activeVenueById.has(id)) {
      setVenueFeatureState(id,{hasPromo:true});
    }
  });
}

function reapplyAuxiliaryFeatureState() {
  applyAdvancedFeatureState();
  applyEventFeatureState();
  applyPromoFeatureState();
}

function venueInsideBounds(venue,bounds) {
  if (!venue || !bounds) return false;
  return (
    venue.latitude >= bounds.south &&
    venue.latitude <= bounds.north &&
    venue.longitude >= bounds.west &&
    venue.longitude <= bounds.east
  );
}

function countStateTotals(bounds) {
  var totals={total:0,open:0,closed:0,unknown:0};
  activeVenueById.forEach(function(venue) {
    if (bounds && !venueInsideBounds(venue,bounds)) return;
    totals.total += 1;
    if (venue.markerState === "open") totals.open += 1;
    else if (venue.markerState === "closed") totals.closed += 1;
    else totals.unknown += 1;
  });
  return totals;
}

function countExpectedVisible(bounds) {
  var total=0;
  activeVenueById.forEach(function(venue,id) {
    if (bounds && !venueInsideBounds(venue,bounds)) return;
    if (
      categoryFilter !== "todas" &&
      venue.category !== canonicalCategory(categoryFilter)
    ) return;

    if (
      stateFilterMode === "no_cerrados" &&
      venue.markerState !== "open"
    ) return;

    if (
      advancedFilterActive &&
      !(advancedAllowedIds && advancedAllowedIds.has(id))
    ) return;

    total += 1;
  });
  return total;
}

function countRenderedVenueIds() {
  if (!map || !map.getLayer(VENUE_LAYER)) return 0;

  // queryRenderedFeatures is diagnostic only. On the national 120k-point
  // dataset it can monopolize the main thread for no product benefit.
  if (activeVenueById.size > 20000 || map.getZoom() < 9) return -1;

  var rendered=[];
  try {
    rendered=map.queryRenderedFeatures(undefined,{layers:[VENUE_LAYER]})||[];
  } catch (_) {}

  var ids=new Set();
  rendered.forEach(function(feature) {
    var id=String(
      feature && feature.properties && (
        feature.properties.venueId || feature.properties.id
      ) || feature && feature.id || ""
    );
    if (id) ids.add(id);
  });
  return ids.size;
}

function diagnostics(reason) {
  if (!map || !map.getSource(VENUE_SOURCE)) return;

  var viewport=getCurrentBounds();
  var sourceTotals=countStateTotals(null);
  var viewportTotals=countStateTotals(viewport);
  var expected=countExpectedVisible(viewport);
  var rendered=countRenderedVenueIds();

  var snapshot={
    reason:reason,
    zoom:Number(map.getZoom().toFixed(2)),
    total:viewportTotals.total,
    open:viewportTotals.open,
    closed:viewportTotals.closed,
    unknown:viewportTotals.unknown,
    sourceFeatures:sourceTotals.total,
    expected:expected,
    rendered:rendered,
    stateFilter:stateFilterMode,
    category:categoryFilter,
    requestGeneration:requestGeneration,
    datasetGeneration:activeDatasetGeneration,
    requestReason:lastRequestReason,
    rendererMode:rendererMode,
    hybridTileFailed:hybridTileFailed
  };

  window.__barliveLastDiagnostics=snapshot;

  console.log(
    "[MAP_RENDER][DATA] generation="+activeDatasetGeneration+
    " viewportTotal="+viewportTotals.total+
    " open="+viewportTotals.open+
    " closed="+viewportTotals.closed+
    " unknown="+viewportTotals.unknown
  );
  console.log(
    "[MAP_RENDER][SOURCE] generation="+activeDatasetGeneration+
    " features="+sourceTotals.total
  );
  console.log(
    "[MAP_RENDER][FILTER] mode="+stateFilterMode+
    " expected="+expected
  );
  console.log(
    "[MAP_RENDER][RENDERED] features="+rendered+
    " reason="+reason
  );

  post("map_diagnostics",snapshot);
}

var diagnosticTimer=null;
function scheduleDiagnostics(reason) {
  if (diagnosticTimer) clearTimeout(diagnosticTimer);
  diagnosticTimer=setTimeout(function() {
    diagnosticTimer=null;
    diagnostics(reason);
  },100);
}

function persistViewportCache(rows,coverage) {
  if (!Array.isArray(rows) || rows.length > 12000) return;
  try {
    var center=map ? map.getCenter() : null;
    localStorage.setItem(
      DATA_CACHE_KEY,
      JSON.stringify({
        savedAt:Date.now(),
        coverage:coverage,
        view:center && map ? {
          lng:Number(center.lng),
          lat:Number(center.lat),
          zoom:Number(map.getZoom())
        } : null,
        rows:rows
      })
    );
  } catch (_) {}
}

function commitVenueRows(rows,coverage,generation,sourceLabel) {
  if (generation !== requestGeneration) {
    console.log(
      "[MAP_RENDER][STALE_RESPONSE] generation="+generation+
      " current="+requestGeneration+
      " stage=commit"
    );
    return false;
  }

  var normalized=rowsToFeatureCollection(rows);
  var source=map && map.getSource(VENUE_SOURCE);
  if (!source) return false;

  activeRows=Array.isArray(rows) ? rows : [];
  activeVenueById=normalized.byId;
  activeCoverage=coverage;
  activeDatasetGeneration=generation;

  if (sourceLabel === "national-static") {
    activeDatasetMode="national-static";
    lastNationalStateRefreshAt=Date.now();
  } else if (sourceLabel === "viewport-static") {
    activeDatasetMode="viewport-static";
  } else if (
    sourceLabel === "state-refresh-local" &&
    activeDatasetMode === "national-static"
  ) {
    // A national schedule refresh is intentionally infrequent. Advance the
    // timestamp after the atomic commit so the 60s timer cannot immediately
    // recalculate all 120k venues again on every subsequent tick.
    lastNationalStateRefreshAt=Date.now();
  } else if (sourceLabel === "network" || sourceLabel === "local-cache") {
    activeDatasetMode="viewport";
  }

  source.setData(normalized.collection);
  reapplyAuxiliaryFeatureState();
  applyFilters();

  if (!shouldUseHybridRenderer()) {
    activateCanonicalRenderer("commit-"+String(sourceLabel||"unknown"));
  }

  if (sourceLabel !== "local-cache") {
    persistViewportCache(activeRows,activeCoverage);
  }

  var totals=countStateTotals();

  console.log(
    "[MAP_RENDER][COMMIT] generation="+generation+
    " source="+sourceLabel+
    " total="+totals.total+
    " open="+totals.open+
    " closed="+totals.closed+
    " unknown="+totals.unknown+
    " duplicateIds="+normalized.duplicateVenueIds+
    " nearCoordinatePairs="+normalized.nearCoordinatePairs
  );

  post("map_marker_count",{count:totals.total});
  post("map_dataset_ready",{
    generation:generation,
    source:sourceLabel,
    total:totals.total,
    open:totals.open,
    closed:totals.closed,
    unknown:totals.unknown,
    duplicateVenueIds:normalized.duplicateVenueIds,
    nearCoordinatePairs:normalized.nearCoordinatePairs
  });

  scheduleDiagnostics("commit-"+sourceLabel);
  return true;
}

function restoreViewportCache(recenter) {
  try {
    var raw=localStorage.getItem(DATA_CACHE_KEY);
    if (!raw) return false;

    var payload=JSON.parse(raw);
    if (
      !payload ||
      !Array.isArray(payload.rows) ||
      !payload.rows.length ||
      !payload.coverage ||
      Date.now()-Number(payload.savedAt||0) > DATA_CACHE_MAX_AGE
    ) return false;

    // Direct refreshes start from the national fallback viewport. Reuse the
    // last real viewport before evaluating coverage so a warm cache can paint
    // immediately instead of being rejected just because the shell starts at z6.
    if (
      recenter === true &&
      payload.view &&
      Number.isFinite(Number(payload.view.lng)) &&
      Number.isFinite(Number(payload.view.lat)) &&
      Number.isFinite(Number(payload.view.zoom))
    ) {
      map.jumpTo({
        center:[Number(payload.view.lng),Number(payload.view.lat)],
        zoom:Math.max(4,Math.min(20,Number(payload.view.zoom)))
      });
    }

    var current=getCurrentBounds();
    if (!boundsContain(payload.coverage,current)) return false;

    // Cached rows include schedules. Recompute the marker state with the
    // current Madrid clock so a refresh never revives stale colours.
    var realtime=applyRealtimeScheduleStates(payload.rows);
    var generation=requestGeneration;

    var restored=commitVenueRows(
      realtime.rows,
      payload.coverage,
      generation,
      "local-cache"
    );

    if (restored) {
      console.log(
        "[MAP_RENDER][CACHE_RESTORE] generation="+generation+
        " total="+realtime.rows.length+
        " knownStates="+realtime.knownStates
      );
    }

    return restored;
  } catch (_) {
    return false;
  }
}

function buildVenueDataUrl(bounds,offset) {
  return (
    VENUE_DATA_URL +
    "?select=id,latitud,longitud,barlive_type,barlive_types,destacado,horarios_completos,google_business_status,osm_opening_hours:osm_tags->>opening_hours" +
    "&activo=eq.true" +
    "&latitud=gte." + encodeURIComponent(bounds.south.toFixed(6)) +
    "&latitud=lte." + encodeURIComponent(bounds.north.toFixed(6)) +
    "&longitud=gte." + encodeURIComponent(bounds.west.toFixed(6)) +
    "&longitud=lte." + encodeURIComponent(bounds.east.toFixed(6)) +
    "&order=id.asc" +
    "&limit=" + DATA_PAGE_SIZE +
    "&offset=" + offset
  );
}


function fetchDataPage(url,label,offset,controller) {
  return fetch(url,{
    method:"GET",
    cache:"no-store",
    signal:controller.signal,
    headers:{
      Accept:"application/json",
      apikey:DATA_APIKEY
    }
  }).then(function(response) {
    if (!response.ok) {
      throw new Error(
        label+" REST HTTP "+response.status+
        " offset="+offset
      );
    }
    return response.json();
  });
}

async function fetchPagedRows(
  bounds,
  generation,
  controller,
  buildUrl,
  label,
  batchSize
) {
  var all=[];
  var offset=0;
  var size=Math.max(1,Number(batchSize)||1);

  while (true) {
    var requests=[];
    for (var i=0;i<size;i+=1) {
      var pageOffset=offset+(i*DATA_PAGE_SIZE);
      requests.push(
        fetchDataPage(
          buildUrl(bounds,pageOffset),
          label,
          pageOffset,
          controller
        )
      );
    }

    var pages=await Promise.all(requests);

    if (
      controller.signal.aborted ||
      generation !== requestGeneration
    ) return null;

    var reachedEnd=false;
    for (var pageIndex=0;pageIndex<pages.length;pageIndex+=1) {
      var page=pages[pageIndex];
      if (!Array.isArray(page)) {
        throw new Error(label+" REST payload is not an array");
      }
      all=all.concat(page);
      if (page.length < DATA_PAGE_SIZE) {
        reachedEnd=true;
        break;
      }
    }

    if (all.length > DATA_MAX_ROWS) {
      throw new Error(
        label+" viewport exceeds safety limit "+DATA_MAX_ROWS
      );
    }

    if (reachedEnd) break;
    offset += DATA_PAGE_SIZE*size;
  }

  return all;
}

function decodeNationalSnapshotRows(compactRows) {
  var decoded=[];
  (Array.isArray(compactRows)?compactRows:[]).forEach(function(item) {
    if (!Array.isArray(item) || item.length < 8) return;

    var category=NATIONAL_CATEGORY_BY_CODE[Number(item[3])];
    if (!category) return;

    decoded.push({
      id:String(item[0]||""),
      latitud:Number(item[1]),
      longitud:Number(item[2]),
      barlive_type:category,
      destacado:Number(item[4]||0)===1,
      horarios_completos:item[5] == null ? null : item[5],
      google_business_status:item[6] == null ? null : item[6],
      osm_opening_hours:item[7] == null ? null : item[7]
    });
  });
  return decoded;
}

function lonToTileX(lon,z) {
  var n=Math.pow(2,z);
  return Math.floor((Number(lon)+180)/360*n);
}

function latToTileY(lat,z) {
  var n=Math.pow(2,z);
  var clipped=Math.max(-85.05112878,Math.min(85.05112878,Number(lat)));
  var rad=clipped*Math.PI/180;
  return Math.floor((1-Math.asinh(Math.tan(rad))/Math.PI)/2*n);
}

function rememberViewportTile(key,rows) {
  if (viewportTileCache.has(key)) viewportTileCache.delete(key);
  viewportTileCache.set(key,rows);

  while (viewportTileCache.size>24) {
    var oldest=viewportTileCache.keys().next().value;
    viewportTileCache.delete(oldest);
  }
}

async function getViewportTileManifest(controller) {
  if (viewportTileManifest) return viewportTileManifest;

  var response=await fetch(VIEWPORT_TILE_ROOT+"/manifest.json",{
    method:"GET",
    cache:"no-cache",
    signal:controller.signal,
    headers:{Accept:"application/json"}
  });

  if (!response.ok) {
    throw new Error("viewport tile manifest HTTP "+response.status);
  }

  var manifest=await response.json();
  if (
    !manifest ||
    Number(manifest.v)!==1 ||
    Number(manifest.z)!==VIEWPORT_TILE_Z ||
    !manifest.tiles ||
    typeof manifest.tiles!=="object"
  ) {
    throw new Error("invalid viewport tile manifest");
  }

  viewportTileManifest=manifest;
  return manifest;
}

function viewportTileKeys(bounds,manifest) {
  var minX=Math.min(
    lonToTileX(bounds.west,VIEWPORT_TILE_Z),
    lonToTileX(bounds.east,VIEWPORT_TILE_Z)
  );
  var maxX=Math.max(
    lonToTileX(bounds.west,VIEWPORT_TILE_Z),
    lonToTileX(bounds.east,VIEWPORT_TILE_Z)
  );
  var minY=Math.min(
    latToTileY(bounds.north,VIEWPORT_TILE_Z),
    latToTileY(bounds.south,VIEWPORT_TILE_Z)
  );
  var maxY=Math.max(
    latToTileY(bounds.north,VIEWPORT_TILE_Z),
    latToTileY(bounds.south,VIEWPORT_TILE_Z)
  );

  var keys=[];
  for (var x=minX;x<=maxX;x+=1) {
    for (var y=minY;y<=maxY;y+=1) {
      var key=x+"/"+y;
      if (manifest.tiles[key]) keys.push(key);
    }
  }
  return keys;
}

async function prewarmStaticViewportTiles(bounds) {
  if (!bounds) return;

  var started=Date.now();

  try {
    var response=await fetch(VIEWPORT_TILE_ROOT+"/manifest.json",{
      method:"GET",
      cache:"no-cache",
      headers:{Accept:"application/json"}
    });
    if (!response.ok) return;

    var manifest=await response.json();
    if (
      !manifest ||
      Number(manifest.v)!==1 ||
      Number(manifest.z)!==VIEWPORT_TILE_Z ||
      !manifest.tiles ||
      typeof manifest.tiles!=="object"
    ) return;

    // Share the parsed manifest with the real viewport request.
    viewportTileManifest=manifest;

    var keys=viewportTileKeys(bounds,manifest);
    if (!keys.length || keys.length>VIEWPORT_TILE_MAX_REQUESTS) return;

    var version=String(manifest.sourceSnapshotSha256||"").slice(0,12);

    await Promise.allSettled(keys.map(async function(key) {
      if (viewportTileCache.has(key)) return;

      var parts=key.split("/");
      var tileResponse=await fetch(
        VIEWPORT_TILE_ROOT+"/"+parts[0]+"/"+parts[1]+".json?v="+encodeURIComponent(version),
        {
          method:"GET",
          cache:"force-cache",
          headers:{Accept:"application/json"}
        }
      );

      if (!tileResponse.ok) return;

      var payload=await tileResponse.json();
      if (!payload || !Array.isArray(payload.rows)) return;

      rememberViewportTile(key,payload.rows);
    }));

    console.log(
      "[MAP_RENDER][VIEWPORT_STATIC_PREWARM]"+
      " tiles="+keys.length+
      " cached="+viewportTileCache.size+
      " elapsedMs="+(Date.now()-started)
    );
  } catch (_) {
    // Pure optimization. The canonical request keeps its CDN + REST fallback.
  }
}

async function fetchStaticViewportRows(bounds,generation,controller) {
  var started=Date.now();
  var manifest=await getViewportTileManifest(controller);

  if (
    controller.signal.aborted ||
    generation!==requestGeneration
  ) return null;

  var keys=viewportTileKeys(bounds,manifest);
  if (keys.length>VIEWPORT_TILE_MAX_REQUESTS) {
    throw new Error(
      "viewport tile request count exceeds "+VIEWPORT_TILE_MAX_REQUESTS+
      ": "+keys.length
    );
  }

  var cacheHits=0;
  var version=String(manifest.sourceSnapshotSha256||"").slice(0,12);

  var pages=await Promise.all(keys.map(async function(key) {
    if (viewportTileCache.has(key)) {
      cacheHits+=1;
      return viewportTileCache.get(key);
    }

    var parts=key.split("/");
    var response=await fetch(
      VIEWPORT_TILE_ROOT+"/"+parts[0]+"/"+parts[1]+".json?v="+encodeURIComponent(version),
      {
        method:"GET",
        cache:"force-cache",
        signal:controller.signal,
        headers:{Accept:"application/json"}
      }
    );

    if (!response.ok) {
      throw new Error(
        "viewport tile HTTP "+response.status+" key="+key
      );
    }

    var payload=await response.json();
    if (!payload || !Array.isArray(payload.rows)) {
      throw new Error("invalid viewport tile payload key="+key);
    }

    rememberViewportTile(key,payload.rows);
    return payload.rows;
  }));

  if (
    controller.signal.aborted ||
    generation!==requestGeneration
  ) return null;

  var byId=new Map();
  pages.forEach(function(rows) {
    (Array.isArray(rows)?rows:[]).forEach(function(item) {
      if (!Array.isArray(item) || item.length<8) return;

      var id=String(item[0]||"");
      var lat=Number(item[1]);
      var lng=Number(item[2]);
      if (
        !id ||
        !Number.isFinite(lat) ||
        !Number.isFinite(lng) ||
        lat<bounds.south ||
        lat>bounds.north ||
        lng<bounds.west ||
        lng>bounds.east
      ) return;

      var category=NATIONAL_CATEGORY_BY_CODE[Number(item[3])];
      if (!category) return;

      byId.set(id,{
        id:id,
        latitud:lat,
        longitud:lng,
        barlive_type:category,
        destacado:Number(item[4]||0)===1,
        horarios_completos:item[5] == null ? null : item[5],
        google_business_status:item[6] == null ? null : item[6],
        osm_opening_hours:item[7] == null ? null : item[7]
      });
    });
  });

  var rows=Array.from(byId.values());

  console.log(
    "[MAP_RENDER][VIEWPORT_STATIC_FETCH] generation="+generation+
    " tiles="+keys.length+
    " cacheHits="+cacheHits+
    " rows="+rows.length+
    " elapsedMs="+(Date.now()-started)
  );

  return rows;
}

async function fetchNationalVenueRows(bounds,generation,controller) {
  try {
    if (!nationalSnapshotCompact) {
      var started=Date.now();
      var response=await fetch(NATIONAL_SNAPSHOT_URL,{
        method:"GET",
        cache:"default",
        signal:controller.signal,
        headers:{Accept:"application/json"}
      });

      if (!response.ok) {
        throw new Error("national snapshot HTTP "+response.status);
      }

      var payload=await response.json();
      if (
        !payload ||
        Number(payload.v)!==1 ||
        !Array.isArray(payload.rows) ||
        payload.rows.length < 100000
      ) {
        throw new Error("invalid national snapshot payload");
      }

      if (
        controller.signal.aborted ||
        generation !== requestGeneration
      ) return null;

      nationalSnapshotCompact=payload.rows;

      console.log(
        "[MAP_RENDER][NATIONAL_STATIC_FETCH] generation="+generation+
        " rows="+nationalSnapshotCompact.length+
        " elapsedMs="+(Date.now()-started)
      );
    } else {
      console.log(
        "[MAP_RENDER][NATIONAL_STATIC_MEMORY] generation="+generation+
        " rows="+nationalSnapshotCompact.length
      );
    }

    return decodeNationalSnapshotRows(nationalSnapshotCompact);
  } catch (error) {
    if (error && error.name === "AbortError") throw error;

    console.warn(
      "[MAP_RENDER][NATIONAL_STATIC_FALLBACK] generation="+generation,
      String(error && error.message || error)
    );

    // Native WebViews with restrictive cross-origin policies keep the proven
    // REST path as a safety net. Web production normally uses the static CDN.
    return fetchPagedRows(
      bounds,
      generation,
      controller,
      buildVenueDataUrl,
      "catalogue-national-fallback",
      DATA_PAGE_BATCH
    );
  }
}

async function fetchCanonicalRows(
  bounds,
  generation,
  controller,
  useNationalSnapshot,
  useStaticViewport
) {
  var venueRows=null;
  var mode="viewport-rest";

  if (useNationalSnapshot) {
    venueRows=await fetchNationalVenueRows(
      bounds,
      generation,
      controller
    );
    mode="national";
  } else if (useStaticViewport) {
    try {
      venueRows=await fetchStaticViewportRows(
        bounds,
        generation,
        controller
      );
      mode="viewport-static";
    } catch (error) {
      if (error && error.name==="AbortError") throw error;

      console.warn(
        "[MAP_RENDER][VIEWPORT_STATIC_FALLBACK] generation="+generation,
        String(error && error.message || error)
      );

      venueRows=await fetchPagedRows(
        bounds,
        generation,
        controller,
        buildVenueDataUrl,
        "catalogue-static-fallback",
        DATA_PAGE_BATCH
      );
      mode="viewport-rest-fallback";
    }
  } else {
    venueRows=await fetchPagedRows(
      bounds,
      generation,
      controller,
      buildVenueDataUrl,
      "catalogue",
      DATA_PAGE_BATCH
    );
  }

  if (!venueRows) return null;

  var realtime=applyRealtimeScheduleStates(venueRows);

  console.log(
    "[MAP_RENDER][SCHEDULE_STATE] generation="+generation+
    " mode="+mode+
    " catalogue="+venueRows.length+
    " knownStates="+realtime.knownStates+
    " barlive="+realtime.barliveStates+
    " osm="+realtime.osmStates+
    " business="+realtime.businessStates+
    " merged="+realtime.rows.length
  );

  return {
    rows:realtime.rows,
    mode:mode
  };
}

async function refreshCanonicalStates() {
  if (shouldUseHybridRenderer() || rendererMode === "hybrid") return;

  if (
    !map ||
    !map.getSource(VENUE_SOURCE) ||
    !activeCoverage ||
    !Array.isArray(activeRows) ||
    !activeRows.length
  ) return;

  // A viewport replacement owns the canonical dataset while it is in flight.
  if (viewportRequestInFlight) {
    console.log(
      "[MAP_RENDER][STATE_REFRESH_SKIPPED] reason=viewport-in-flight"+
      " generation="+requestGeneration
    );
    return;
  }

  if (activeDatasetMode === "national-static") {
    var nationalAge=Date.now()-lastNationalStateRefreshAt;
    if (nationalAge < 5*60*1000) {
      console.log(
        "[MAP_RENDER][STATE_REFRESH_SKIPPED] reason=national-static-fresh"+
        " ageMs="+nationalAge
      );
      return;
    }
  }

  var coverage=activeCoverage;
  var generation=++requestGeneration;
  lastRequestReason="state-refresh-local";

  var realtime=applyRealtimeScheduleStates(activeRows);

  console.log(
    "[MAP_RENDER][STATE_REFRESH_LOCAL] generation="+generation+
    " knownStates="+realtime.knownStates+
    " barlive="+realtime.barliveStates+
    " osm="+realtime.osmStates+
    " business="+realtime.businessStates
  );

  commitVenueRows(
    realtime.rows,
    coverage,
    generation,
    "state-refresh-local"
  );
}

async function requestCanonicalViewport(force,reason) {
  if (!map || !map.getSource(VENUE_SOURCE)) return;

  if (shouldUseHybridRenderer()) {
    lastRequestReason=String(reason || "hybrid");
    enterHybridTileMode(lastRequestReason);
    scheduleDiagnostics("hybrid-tile-only");
    return;
  }

  var current=getCurrentBounds();
  if (!current) return;

  var zoom=map.getZoom();
  var wantsNational=zoom<=NATIONAL_SNAPSHOT_MAX_ZOOM;
  var wantsStaticViewport=
    !wantsNational &&
    zoom>=VIEWPORT_TILE_MIN_MAP_ZOOM;
  var desiredMode=wantsNational
    ? "national-static"
    : wantsStaticViewport
      ? "viewport-static"
      : "viewport";
  var modeMatches=activeDatasetMode===desiredMode;

  if (
    !force &&
    modeMatches &&
    activeCoverage &&
    activeVenueById.size &&
    boundsContain(activeCoverage,current)
  ) {
    activateCanonicalRenderer("coverage-hit");
    scheduleDiagnostics("coverage-hit");
    return;
  }

  var coverage=wantsNational
    ? NATIONAL_COVERAGE
    : paddedBounds(current);
  var generation=++requestGeneration;
  lastRequestReason=String(reason || "viewport");

  if (requestAbortController) {
    try { requestAbortController.abort(); } catch (_) {}
  }

  var controller=new AbortController();
  requestAbortController=controller;
  viewportRequestInFlight=true;

  console.log(
    "[MAP_RENDER][VIEWPORT_REQUEST] generation="+generation+
    " zoom="+map.getZoom().toFixed(2)+
    " bbox="+[
      coverage.west,
      coverage.south,
      coverage.east,
      coverage.north
    ].map(function(value){return value.toFixed(5);}).join(",")+
    " reason="+lastRequestReason
  );

  try {
    var fetched=await fetchCanonicalRows(
      coverage,
      generation,
      controller,
      wantsNational,
      wantsStaticViewport
    );
    if (!fetched || !fetched.rows) return;

    if (
      controller.signal.aborted ||
      generation !== requestGeneration
    ) {
      console.log(
        "[MAP_RENDER][STALE_RESPONSE] generation="+generation+
        " current="+requestGeneration+
        " stage=network"
      );
      return;
    }

    var sourceLabel=wantsNational
      ? "national-static"
      : fetched.mode==="viewport-static"
        ? "viewport-static"
        : "network";

    commitVenueRows(
      fetched.rows,
      coverage,
      generation,
      sourceLabel
    );
  } catch (error) {
    if (error && error.name === "AbortError") return;
    if (generation !== requestGeneration) return;

    console.warn(
      "[MAP_RENDER][VIEWPORT_ERROR] generation="+generation,
      String(error && error.message || error)
    );
    post("map_error",{
      recoverable:true,
      generation:generation,
      message:String(error && error.message || error)
    });

    // Keep the previous committed FeatureCollection untouched. No fallback
    // renderer is activated and no grey replacement dataset is created.
  } finally {
    if (requestAbortController === controller) {
      requestAbortController=null;
      viewportRequestInFlight=false;
    }
  }
}

function scheduleCanonicalViewport(reason) {
  if (requestTimer) clearTimeout(requestTimer);
  requestTimer=setTimeout(function() {
    requestTimer=null;
    requestCanonicalViewport(false,reason || "moveend");
  },80);
}

function hasAdvancedCriteria(criteria) {
  criteria=criteria||{};
  return !!(
    (Array.isArray(criteria.servicios)&&criteria.servicios.length) ||
    (Array.isArray(criteria.ambiente)&&criteria.ambiente.length) ||
    (Array.isArray(criteria.clientela)&&criteria.clientela.length) ||
    (criteria.comunidad && criteria.comunidad!=="Todas las Comunidades") ||
    criteria.provincia ||
    (Number(criteria.distancia)>0) ||
    Array.isArray(criteria.tagLocalIds)
  );
}

function normalizeBoolMap(value) {
  return value && typeof value==="object" ? value : {};
}

function distanceKm(aLat,aLng,bLat,bLng) {
  var R=6371;
  var dLat=(bLat-aLat)*Math.PI/180;
  var dLng=(bLng-aLng)*Math.PI/180;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+
    Math.cos(aLat*Math.PI/180)*Math.cos(bLat*Math.PI/180)*
    Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function localMatchesAdvanced(local) {
  var c=advancedCriteria||{};

  if (window.__advancedTagSet) {
    if (!window.__advancedTagSet.has(String(local.id||""))) return false;
  }

  if (Array.isArray(c.servicios) && c.servicios.length) {
    var services=normalizeBoolMap(local.servicios_disponibles);
    for(var i=0;i<c.servicios.length;i++){
      if(services[c.servicios[i]]!==true) return false;
    }
  }

  if (Array.isArray(c.ambiente) && c.ambiente.length) {
    var ambience=normalizeBoolMap(local.ambiente_completo);
    var ambienceOK=false;
    for(var j=0;j<c.ambiente.length;j++){
      if(ambience[c.ambiente[j]]===true){ambienceOK=true;break;}
    }
    if(!ambienceOK) return false;
  }

  if (Array.isArray(c.clientela) && c.clientela.length) {
    var clientele=normalizeBoolMap(local.clientela);
    var clienteleOK=false;
    for(var k=0;k<c.clientela.length;k++){
      if(clientele[c.clientela[k]]===true){clienteleOK=true;break;}
    }
    if(!clienteleOK) return false;
  }

  if (c.comunidad && c.comunidad!=="Todas las Comunidades" && local.comunidad!==c.comunidad) return false;
  if (c.provincia && local.provincia!==c.provincia) return false;

  var maxDistance=Number(c.distancia||0);
  if(maxDistance>0 && window.__userLocation){
    var lat=Number(local.latitud), lng=Number(local.longitud);
    if(!isFinite(lat)||!isFinite(lng)) return false;
    if(distanceKm(window.__userLocation.lat,window.__userLocation.lng,lat,lng)>maxDistance) return false;
  }

  return true;
}

function applyAdvancedRows(rows,generation) {
  if (!advancedFilterActive) return;

  if (Number(generation)!==advancedGeneration) {
    console.log(
      "[MAP_RENDER][STALE_ADVANCED] generation="+generation+
      " current="+advancedGeneration
    );
    return;
  }

  var allowed=new Set();
  (Array.isArray(rows)?rows:[]).forEach(function(local){
    if (
      local &&
      local.id &&
      localMatchesAdvanced(local)
    ) {
      allowed.add(String(local.id));
    }
  });

  advancedAllowedIds=allowed;
  applyAdvancedFeatureState();
  applyFilters();
  scheduleDiagnostics("advanced-data");
}

window.applyAdvancedFilters=function(criteria){
  advancedCriteria=criteria||{};

  advancedFilterActive=hasAdvancedCriteria(advancedCriteria);
  advancedAllowedIds=advancedFilterActive ? new Set() : null;

  if (advancedFilterActive) {
    requestCanonicalViewport(true,"advanced-filter");

function escapeHtml(value){
  return String(value==null?"":value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

window.currentPopupImageCandidates=[];
window.currentPopupImageIndex=0;

window.tryNextPopupImage=function(img){
  var candidates=window.currentPopupImageCandidates||[];
  var next=(window.currentPopupImageIndex||0)+1;
  if(next<candidates.length){
    window.currentPopupImageIndex=next;
    img.src=candidates[next];
    return;
  }
  try{img.remove();}catch(_){}
};

function collectPopupImages(value,output,depth){
  output=output||[];
  depth=Number(depth||0);
  if(depth>4||value==null) return output;

  if(Array.isArray(value)){
    value.forEach(function(item){collectPopupImages(item,output,depth+1);});
    return output;
  }

  if(typeof value==="string"){
    var text=value.trim();
    if(!text) return output;
    if(
      (text.charAt(0)==="["&&text.charAt(text.length-1)==="]") ||
      (text.charAt(0)==="{"&&text.charAt(text.length-1)==="}")
    ){
      try{
        collectPopupImages(JSON.parse(text),output,depth+1);
        return output;
      }catch(_){}
    }
    if(text.indexOf("//")===0) text="https:"+text;
    if(/^http:\/\//i.test(text)) text=text.replace(/^http:\/\//i,"https://");
    if(output.indexOf(text)<0) output.push(text);
    return output;
  }

  if(typeof value==="object"){
    [
      "url","uri","public_url","publicUrl","image_url","imagen_url",
      "foto_url","src","urls","images","imagenes","photos","fotos"
    ].forEach(function(key){
      collectPopupImages(value[key],output,depth+1);
    });
  }
  return output;
}

function popupImagesForLocal(local){
  if(Array.isArray(local&&local.__popupImages)&&local.__popupImages.length){
    return local.__popupImages.slice();

  var out=[];
  [
    local&&local.r2_media_urls,
    local&&local.imagen_url,
    local&&local.portada_url,
    local&&local.galeria_urls,
    local&&local.galeria_fotos,
    local&&local.legacy_media_urls,
    local&&local.foto_principal,
    local&&local.imagenes,
    local&&local.fotos,
    local&&local.photos,
    local&&local.cover_url,
    local&&local.logo_url
  ].forEach(function(value){
    collectPopupImages(value,out,0);
  });
  return out;
}

function popupCategoryValues(local){
  var raw=[];
  if(local&&Array.isArray(local.barlive_types)) raw=raw.concat(local.barlive_types);
  if(local&&local.barlive_type) raw.push(local.barlive_type);
  if(local&&local.tipo) raw.push(local.tipo);

  var seen={};
  return raw.map(function(value){
    return canonicalCategory(value);
  }).filter(function(value){
    if(!value||seen[value]) return false;
    seen[value]=true;
    return true;
  });
}

function popupScheduleForLocal(local){
  if(local&&local.__popupSchedule){

  var result=deriveRealtimeMarkerState(local,madridClockParts());
  var state=normalizeMarkerState(result&&result.state);
  return {

      state==="open" ? "Abierto ahora" :

      "Sin información de horario",
    text:
      state==="open" ? "Abierto ahora" :
      state==="closed" ? "Cerrado ahora" :
      "Sin información de horario",
    estaAbierto:
      state==="open" ? true :
      state==="closed" ? false :
      null,
    tiempoRestante:null,
    color:
      state==="open" ? "#22C55E" :
      state==="closed" ? "#EF4444" :
      "#9CA3AF"
  };
}

window.showPopupFromNative=function(local,coords){
  if(!map || !local || !local.id) return;

  var lng=Number(coords&&coords.lng!=null ? coords.lng : local.longitud);
  var lat=Number(coords&&coords.lat!=null ? coords.lat : local.latitud);
  if(!isFinite(lng)||!isFinite(lat)) return;

  var schedule=popupScheduleForLocal(local);
  var isOpen=schedule.estaAbierto===true;
  var isClosed=schedule.estaAbierto===false;
  var stateColor=String(schedule.color||(
    isOpen ? "#22C55E" :
    isClosed ? "#EF4444" :
    "#9CA3AF"
  ));
  var stateIcon=isOpen ? "🟢" : isClosed ? "🔴" : "⚪";
  var stateText=String(schedule.text||schedule.badge||"Sin información de horario");
  if(schedule.tiempoRestante){
    stateText+=" · "+String(schedule.tiempoRestante);
  }

  var categoryLabels={
    bar:"Bar",
    restaurante:"Restaurante",
    cafeteria:"Café",
    pub:"Pub",
    discoteca:"Discoteca",
    cocteleria:"Coctelería"
  };
  var categories=popupCategoryValues(local);
  var categoryText=categories.length
    ? categories.map(function(category){
        return categoryLabels[category]||category;
      }).join(" · ")
    : "Categoría sin especificar";

  var ratingValue=Number(
    Number(local.rating)>0 ? local.rating :
    Number(local.google_rating)>0 ? local.google_rating :
    0
  );
  var ratingHtml=ratingValue>0
    ? '<div class="popup-rating">⭐ '+escapeHtml(ratingValue.toFixed(1))+'</div>'
    : "";

  var images=popupImagesForLocal(local);
  window.currentPopupImageCandidates=images;
  window.currentPopupImageIndex=0;
  var imageHtml=images.length
    ? '<img src="'+escapeHtml(images[0])+'" class="popup-img" onerror="window.tryNextPopupImage(this)"/>'
    : "";

  var id=String(local.id);
  var eventBanner="";
  if(liveIds.has(id)){
    eventBanner='<div class="popup-banner popup-banner-live"><span>●</span> EN VIVO AHORA</div>';
  }else if(upcomingIds.has(id)){
    eventBanner='<div class="popup-banner popup-banner-upcoming">📅 PRÓXIMO EVENTO</div>';
  }

  var promoInfo=promoById&&promoById[id];
  var promoBanner="";
  if(promoInfo||promoIds.has(id)){
    var promoTitle=promoInfo&&promoInfo.titulo
      ? " · "+escapeHtml(promoInfo.titulo)
      : "";
    promoBanner='<div class="popup-banner popup-banner-promo">🏷️ PROMOCIÓN ACTIVA'+promoTitle+'</div>';
  }

  var html=
    '<div>'+
      promoBanner+
      eventBanner+
      imageHtml+
      '<div class="popup-info">'+
        '<div class="popup-title">'+escapeHtml(local.nombre||"Nombre no disponible")+'</div>'+
        '<div style="font-size:12px;color:#70757A;margin-bottom:10px;display:flex;align-items:flex-start;gap:4px">'+
          '<span style="flex-shrink:0">📍</span>'+
          '<span style="flex:1">'+escapeHtml(local.direccion||"Dirección no disponible")+'</span>'+
        '</div>'+
        ratingHtml+
        '<div class="popup-category">'+escapeHtml(categoryText)+'</div>'+
        '<div style="font-size:12px;font-weight:600;color:'+escapeHtml(stateColor)+';margin-bottom:10px">'+
          stateIcon+" "+escapeHtml(stateText)+
        '</div>'+
        '<a href="#" class="popup-btn" id="barlive-popup-open">'+
          '<span style="color:#FFF">📍 Ver detalles</span>'+
        '</a>'+
      '</div>'+
    '</div>';

  if(window.currentPopup){
    try{window.currentPopup.remove();}catch(_){}
    window.currentPopup=null;
  }

  window.currentPopup=new maplibregl.Popup({
    closeButton:false,
    closeOnClick:true,
    maxWidth:"${ke}px",
    className:"custom-popup",
    offset:16
  })
    .setLngLat([lng,lat])
    .setHTML(html)
    .addTo(map);

  setTimeout(function(){
    var button=document.getElementById("barlive-popup-open");
    if(button){
      button.onclick=function(event){
        if(event&&event.preventDefault) event.preventDefault();
        post("navigate",{id:id});
        return false;
      };
    }
  },0);
};

function registerCategoryIcons() {
  var icons={
    cafeteria:"☕",
    restaurante:"🍽️",
    bar:"🍺",
    pub:"🍻",
    cocteleria:"🍸",
    discoteca:"🪩"
  };

  Object.keys(icons).forEach(function(category){
    var canvas=document.createElement("canvas");
    canvas.width=64;
    canvas.height=64;

    var ctx=canvas.getContext("2d");
    if(!ctx) return;

    ctx.clearRect(0,0,64,64);
    ctx.font='30px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(icons[category],32,33);

    try {
      map.addImage(
        "cat-"+category,
        {
          width:64,
          height:64,
          data:ctx.getImageData(0,0,64,64).data
        }
      );
    } catch (_) {}
  });
}

function addHybridSourceAndLayer() {
  map.addSource(HYBRID_SOURCE,{
    type:"vector",
    tiles:[HYBRID_TILE_URL],
    minzoom:4,
    maxzoom:HYBRID_SOURCE_MAX_ZOOM,
    bounds:[
      NATIONAL_COVERAGE.west,
      NATIONAL_COVERAGE.south,
      NATIONAL_COVERAGE.east,
      NATIONAL_COVERAGE.north
    ],
    promoteId:"s"
  });

  map.addLayer({
    id:HYBRID_LAYER,
    type:"circle",
    source:HYBRID_SOURCE,
    "source-layer":"locales",
    minzoom:4,
    layout:{visibility:"visible"},
    paint:{
      "circle-radius":[
        "interpolate",["linear"],["zoom"],
        4,1.6,
        7,2.3,
        9,3.2,
        10.5,7.4,
        13,10.5,
        16,13,
        20,14
      ],
      "circle-color":[
        "match",
        ["string",["feature-state","markerState"],"unknown"],
        "open","#22C55E",
        "closed","#EF4444",
        "#94A3B8"
      ],
      "circle-opacity":1,
      "circle-stroke-opacity":1,
      "circle-stroke-width":[
        "interpolate",["linear"],["zoom"],
        4,["case",["==",["get","d"],1],3,0],
        10.5,["case",["==",["get","d"],1],3,2],
        20,["case",["==",["get","d"],1],3,2]
      ],
      "circle-stroke-color":[
        "case",
        ["==",["get","d"],1],
        "#F59E0B",
        "#FFFFFF"
      ]
    }
  });

  // Same close-zoom visual language as the previous GeoJSON renderer, but the
  // glyph is attached directly to the static vector-tile feature.
  map.addLayer({
    id:HYBRID_ICON_LAYER,
    type:"symbol",
    source:HYBRID_SOURCE,
    "source-layer":"locales",
    minzoom:13,
    layout:{
      visibility:"visible",
      "icon-image":[
        "case",
        ["==",["get","t"],2],"cat-cafeteria",
        ["==",["get","t"],1],"cat-restaurante",
        ["==",["get","t"],3],"cat-pub",
        ["==",["get","t"],5],"cat-cocteleria",
        ["==",["get","t"],4],"cat-discoteca",
        "cat-bar"
      ],
      "icon-size":[
        "interpolate",["linear"],["zoom"],
        13,0.50,
        16,0.58,
        20,0.62
      ],
      "icon-anchor":"center",
      "icon-allow-overlap":true,
      "icon-ignore-placement":true,
      "icon-padding":0
    },
    paint:{
      "icon-opacity":1
    }
  });
}

  map.addSource(VENUE_SOURCE,{

    }

  map.addLayer({

function venueIsVisible(venue) {
  if (!venue) return false;

  if (
    categoryFilter !== "todas" &&
    venue.category !== canonicalCategory(categoryFilter)
  ) return false;

  if (
    stateFilterMode === "no_cerrados" &&
    venue.markerState !== "open"
  ) return false;

  if (
    advancedFilterActive &&
    !(advancedAllowedIds && advancedAllowedIds.has(venue.id))
  ) return false;

  return true;
}

function requestPopupFromFeature(feature){
  if(!feature) return;

  var props=feature.properties||{};
  var id=String(
    props.venueId ||
    props.id ||
    props.i ||
    ""
  );

  var coords=feature.geometry && feature.geometry.coordinates;

  // Low zoom tiles intentionally omit 36-byte UUIDs. A click there zooms
  // toward the venue first; UUIDs are present from z8 upward.
  if (!id) {
    if (Array.isArray(coords) && map) {
      map.easeTo({
        center:[Number(coords[0]),Number(coords[1])],
        zoom:Math.max(8.25,Math.min(9.25,map.getZoom()+2.5)),
        duration:280
      });
    }
    return;
  }

  var venue=activeVenueById.get(id);
  var hybridCode=Number(props.t);
  var featureCategory=canonicalCategory(
    props.category ||
    props.tipo ||
    NATIONAL_CATEGORY_BY_CODE[hybridCode] ||
    ""
  );

  var featureState=normalizeMarkerState(
    props.markerState!=null ? props.markerState : props.estado
  );

  if (!venue && props.s!=null && map) {
    try {
      var hybridFeatureState=map.getFeatureState({
        source:HYBRID_SOURCE,
        sourceLayer:"locales",
        id:Number(props.s)
      });
      featureState=normalizeMarkerState(
        hybridFeatureState && hybridFeatureState.markerState
      );
    } catch (_) {}
  }

  if (venue) {
    if (!venueIsVisible(venue)) return;
  } else {
    if (
      categoryFilter !== "todas" &&
      featureCategory !== canonicalCategory(categoryFilter)
    ) return;
    if (
      stateFilterMode === "no_cerrados" &&
      featureState !== "open"
    ) return;
  }

  post("map_popup_request",{
    id:id,
    markerState:venue ? venue.markerState : featureState,
    coordinates:Array.isArray(coords)
      ? {lng:Number(coords[0]),lat:Number(coords[1])}
      : null
  });
}

window.__barliveTestSnapshot=function(){
  diagnostics("test");
  return window.__barliveLastDiagnostics || null;
};

window.__barliveIdentity=function(ids){
  return (ids||[]).map(function(rawId){
    var id=String(rawId||"");
    var venue=activeVenueById.get(id) || null;

    return {
      venueId:id,
      markerState:venue ? venue.markerState : null,
      present:!!venue,
      visible:venue ? venueIsVisible(venue) : false
    };
  });
};

function handleMapError(event) {
  var message=String(
    event && event.error && event.error.message ||
    "MapLibre error"
  );

  console.warn("[MAP_RENDER][MAP_ERROR]",message);

  if (
    event &&
    event.sourceId===HYBRID_SOURCE &&
    !hybridTileFailed
  ) {
    hybridTileFailed=true;
    setHybridVisibility(false);
    console.warn("[MAP_RENDER][HYBRID_FALLBACK]",message);
    setTimeout(function(){
      requestCanonicalViewport(true,"hybrid-tile-error");
    },0);
  }

  post("map_error",{
    message:message,
    recoverable:true,
    sourceId:event && event.sourceId || ""
  });
}

function setupMapEvents(){
  map.on("sourcedata",function(event){
    if(event.sourceId===VENUE_SOURCE) {
      reapplyAuxiliaryFeatureState();
      scheduleDiagnostics("sourcedata");
      return;
    }
    if(event.sourceId===HYBRID_SOURCE) {
      scheduleHybridStateRefresh("sourcedata");
      scheduleDiagnostics("hybrid-sourcedata");
    }
  });

  map.on("zoom",function(){
    if (shouldUseHybridRenderer()) {
      enterHybridTileMode("zoom");
    }
  });

  map.on("moveend",function(){
    scheduleCanonicalViewport("moveend");
    if (shouldUseHybridRenderer()) {
      scheduleHybridStateRefresh("moveend");
    }

    if (advancedFilterActive) {
      requestAdvancedViewport();
    }

    scheduleDiagnostics("moveend");
  });

  map.on("idle",function(){
    // Diagnostic only. Never changes source data, renderer authority or state.
    scheduleDiagnostics("idle");
  });

  map.on("click",HYBRID_LAYER,function(event){
    requestPopupFromFeature(
      event.features && event.features[0]
    );
  });

  map.on("click",HYBRID_ICON_LAYER,function(event){
    requestPopupFromFeature(
      event.features && event.features[0]
    );
  });

  map.on("click",VENUE_LAYER,function(event){
    requestPopupFromFeature(
      event.features && event.features[0]
    );
  });

  map.on("click",ICON_LAYER,function(event){
    requestPopupFromFeature(
      event.features && event.features[0]
    );
  });

  map.on("mouseenter",HYBRID_LAYER,function(){
    map.getCanvas().style.cursor="pointer";
  });

  map.on("mouseleave",HYBRID_LAYER,function(){
    map.getCanvas().style.cursor="";
  });

  map.on("mouseenter",VENUE_LAYER,function(){
    map.getCanvas().style.cursor="pointer";
  });

  map.on("mouseleave",VENUE_LAYER,function(){
    map.getCanvas().style.cursor="";
  });
}

function init(){
  // Tiny same-origin manifest request only. It selects immutable static MVT
  // files; marker navigation never calls Render or Supabase.
  prepareHybridStaticManifest();

  if(!window.maplibregl){
    post("map_js_error",{message:"MapLibre unavailable"});
    return;
  }

  map=new maplibregl.Map({
    container:"map",
    style:"https://tiles.openfreemap.org/styles/liberty",
    center:[${n},${e}],
    zoom:${a},
    minZoom:4,
    maxZoom:20,
    attributionControl:false,
    renderWorldCopies:false,
    dragRotate:false,
    pitchWithRotate:false,
    touchPitch:false,
    fadeDuration:0,
    crossSourceCollisions:false
  });

  window.__barliveMap=map;
  map.on("error",handleMapError);

  if (!shouldUseHybridRenderer() && ${a}>=VIEWPORT_TILE_MIN_MAP_ZOOM) {
    try {
      var startupBounds=getCurrentBounds();
      if (startupBounds) {
        startupPrewarmPromise=prewarmStaticViewportTiles(
          paddedBounds(startupBounds)
        );
      }
    } catch (_) {
      startupPrewarmPromise=null;
    }
  }

  try {
    map.addControl(
      new maplibregl.AttributionControl({compact:true}),
      "bottom-right"
    );
  } catch (_) {}

  var didBootstrapCanonicalMap=false;

  function bootstrapCanonicalMap(trigger) {
    if (didBootstrapCanonicalMap) return;

    // MapLibre's public isStyleLoaded() waits for base-style sources/tiles.
    // BarLive only needs the style object itself to accept our GeoJSON source
    // and layers. The internal _loaded flag becomes true much earlier and was
    // verified in-browser to accept addSource/addLayer safely.
    if (!map || !(map.style && map.style._loaded)) return;

    didBootstrapCanonicalMap=true;

    try {
      registerCategoryIcons();
    } catch (error) {
      console.warn("[MAP_RENDER][ICON_WARNING]",error);
    }

    addHybridSourceAndLayer();
    addVenueSourceAndLayers();
    setupMapEvents();

    if (shouldUseHybridRenderer()) {
      enterHybridTileMode("bootstrap");
    } else {
      rendererMode="hybrid";
      setHybridVisibility(true);
      setCanonicalVisibility(false);
    }

    // Cache is only a warm-start input to the SAME canonical source.
    // On direct refresh (national fallback shell), restore the last real
    // viewport first so markers and schedule colours paint immediately.
    var warmRestored=shouldUseHybridRenderer()
      ? false
      : restoreViewportCache(${a<=6?'true':'false'});

    // The exact startup viewport tiles begin downloading as soon as MapLibre
    // exists. If that prewarm is still in flight, let it finish before the
    // canonical request so both paths share the same in-memory tile cache and
    // never duplicate CDN requests.
    var startCanonicalRequest=function() {
      requestCanonicalViewport(
        true,
        warmRestored ? "early-cache-reconcile" : "early-style-ready"
      );
    };

    if (startupPrewarmPromise) {
      var pendingPrewarm=startupPrewarmPromise;
      startupPrewarmPromise=null;
      Promise.resolve(pendingPrewarm).then(
        startCanonicalRequest,
        startCanonicalRequest
      );
    } else {
      startCanonicalRequest();
    }

    refreshTimer=setInterval(function(){
      refreshCanonicalStates();
      if (shouldUseHybridRenderer()) {
        refreshHybridVisibleStates("clock");
      }
    },60000);

    console.log(
      "[MAP_RENDER][BOOTSTRAP] event="+String(trigger||"unknown")+
      " zoom="+map.getZoom().toFixed(2)
    );

    post("map_ready",{
      engine:"barlive-static-mvt-overzoom-v23"
    });

    scheduleDiagnostics("bootstrap-"+String(trigger||"unknown"));
  }

  // First attempt immediately: in MapLibre 3.6 the style object is already
  // internally ready by the time the constructor returns in modern browsers.
  bootstrapCanonicalMap("internal-ready");

  // If a runtime is slightly slower, styledata is the earliest safe retry.
  map.on("styledata",function(){
    bootstrapCanonicalMap("styledata");
  });

  // Public events remain defensive fallbacks for native WebViews and future
  // MapLibre versions. didBootstrapCanonicalMap keeps this strictly once-only.
  map.on("style.load",function(){
    bootstrapCanonicalMap("style.load");
  });

  map.on("load",function(){
    bootstrapCanonicalMap("load");
  });
}

window.addEventListener("beforeunload",function(){
  if(refreshTimer) clearInterval(refreshTimer);
  if(requestTimer) clearTimeout(requestTimer);
  if(hybridStateRefreshTimer) clearTimeout(hybridStateRefreshTimer);
  if(requestAbortController){
    try { requestAbortController.abort(); } catch (_) {}
  }
});

init();
})();
</script>
