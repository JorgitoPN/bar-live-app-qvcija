  var header=findHeader();if(!header){clearWide();return}
  var hr=r(header),sidebar=findSidebar(),sr=sidebar?r(sidebar):null,left=sr?Math.max(0,sr.right):0,cs;
  try{cs=getComputedStyle(header)}catch(_){return}
  var bg=backdrop();
  bg.style.display="block";bg.style.position="fixed";bg.style.pointerEvents="none";
  bg.style.left=left+"px";bg.style.right="0";bg.style.top=Math.max(0,hr.top)+"px";bg.style.height=Math.max(1,hr.height)+"px";
  bg.style.zIndex="1000";bg.style.backgroundColor=cs.backgroundColor;bg.style.backgroundImage=cs.backgroundImage;
  bg.style.backgroundRepeat=cs.backgroundRepeat;bg.style.backgroundPosition=cs.backgroundPosition;bg.style.backgroundSize=cs.backgroundSize;
  bg.style.boxShadow="0 1px 0 rgba(15,23,42,.06)";
  if(wideHeader&&wideHeader!==header)wideHeader.classList.remove("barlive-web-wide-header-v5");
  wideHeader=header;header.classList.add("barlive-web-wide-header-v5");

  var main=findMain(sidebar),rail=findRightRail(main);
  if(wideRail&&wideRail!==rail){
    var old=wideRail.getAttribute("data-bl5-padding-top");
    if(old!==null){if(old)wideRail.style.paddingTop=old;else wideRail.style.removeProperty("padding-top");wideRail.removeAttribute("data-bl5-padding-top")}
    wideRail.removeAttribute("data-bl5-applied");wideRail.classList.remove("barlive-web-wide-right-rail-v5")
  }
  wideRail=rail;
  if(rail){
    if(rail.getAttribute("data-bl5-padding-top")===null)rail.setAttribute("data-bl5-padding-top",rail.style.paddingTop||"");
    var base=parseFloat(rail.getAttribute("data-bl5-base-pt")||"");
    if(!Number.isFinite(base)){base=parseFloat(getComputedStyle(rail).paddingTop)||0;rail.setAttribute("data-bl5-base-pt",String(base))}
    var add=Math.max(0,hr.bottom);
    rail.style.paddingTop=(base+add)+"px";rail.setAttribute("data-bl5-applied",String(add));rail.classList.add("barlive-web-wide-right-rail-v5")
  }
}

function observe(){if(!observer)observer=new MutationObserver(schedule);observer.observe(document.documentElement,{subtree:true,childList:true})}
function apply(){
  if(observer)observer.disconnect();
  fixLogo();
  if(compactWeb())applyCompact();else if(wideDesktop())applyWide();else{clearCompact();clearWide()}
  observe()
}
function schedule(){if(queued)return;queued=true;requestAnimationFrame(function(){queued=false;apply()})}
function start(){apply();addEventListener("resize",schedule,{passive:true});addEventListener("popstate",function(){setTimeout(schedule,0)});document.addEventListener("click",function(){setTimeout(schedule,50);setTimeout(schedule,320)},true);setInterval(schedule,3500)}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start,{once:true});else start()
})();
</script>
</body>
</html>
