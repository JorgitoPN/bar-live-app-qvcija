function frames(){
  return Array.prototype.slice.call(document.querySelectorAll("iframe"));
}
function applyCoords(coords,zoom){
  if(!coords)return;
  frames().forEach(function(frame){
    try{
      var w=frame.contentWindow;
      if(!w)return;
      if(typeof w.updateUserLocation==="function")w.updateUserLocation(coords.latitude,coords.longitude);
      if(typeof w.flyToLocation==="function")w.flyToLocation(coords.latitude,coords.longitude,zoom||13);
    }catch(_){}
  });
}
function persist(coords,accuracy){
  lastCoords=coords;
  try{
    localStorage.setItem("barlive:last-web-location-v1",JSON.stringify({
      latitude:coords.latitude,longitude:coords.longitude,
      accuracy:accuracy==null?null:accuracy,timestamp:Date.now()
    }));
  }catch(_){}
}
function requestLocation(center){
  if(geoBusy)return;
  if(!navigator.geolocation){if(center&&lastCoords)applyCoords(lastCoords,13);return}
  geoBusy=true;
  navigator.geolocation.getCurrentPosition(function(pos){
    geoBusy=false;
    var coords={latitude:Number(pos.coords.latitude),longitude:Number(pos.coords.longitude)};
    if(!isFinite(coords.latitude)||!isFinite(coords.longitude))return;
    persist(coords,pos.coords.accuracy);
    applyCoords(coords,center?13:13);
  },function(){
    geoBusy=false;
    if(center&&lastCoords)applyCoords(lastCoords,13);
  },{enableHighAccuracy:false,timeout:10000,maximumAge:300000});
}

function safeStoredImages(local){
  var out=[];
  function add(v){
    if(!v)return;
    if(Array.isArray(v)){v.forEach(add);return}
    if(typeof v!=="string")return;
    var s=v.trim();
    if(!s||out.indexOf(s)!==-1)return;
    try{
      var u=new URL(s,location.origin),h=u.hostname.toLowerCase(),p=u.pathname.toLowerCase();
      if(h==="places.googleapis.com")return;
      if(h==="maps.googleapis.com"&&(p.indexOf("/maps/api/place/photo")===0||p.indexOf("/maps/api/streetview")===0))return;
    }catch(_){}
    out.push(s);
  }
  add(local.portada_url);add(local.imagen_url);add(local.imagenes);
  add(local.galeria_urls);add(local.galeria_fotos);add(local.fotos_google);
  add(local.r2_media_urls);add(local.legacy_media_urls);
  return out;
}

function loadVenueByName(name){
  name=String(name||"").trim();
  if(!name)return Promise.resolve(null);
  var url=SUPABASE_REST+"?nombre=eq."+encodeURIComponent(name)+"&select=*&limit=1";
  return fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}})
    .then(function(r){if(!r.ok)throw new Error("venue-name "+r.status);return r.json()})
    .then(function(rows){
      var local=rows&&rows[0]||null;
      if(local){
        local.__popupImages=safeStoredImages(local);
        local.__popupSchedule={
          estaAbierto:local.esta_abierto===true?true:local.esta_abierto===false?false:null,
          text:local.esta_abierto===true?"Abierto ahora":local.esta_abierto===false?"Cerrado":"Sin información de horario",
          color:local.esta_abierto===true?"#22C55E":local.esta_abierto===false?"#EF4444":"#9CA3AF"
        };
        venueCache.set(String(local.id||""),local);
      }
      return local;
    }).catch(function(){return null});
}

  var url=SUPABASE_REST+"?id=eq."+encodeURIComponent(id)+"&select=*";

    .then(function(rows){

}
