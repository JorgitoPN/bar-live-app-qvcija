var geoBusy=false;
var lastCoords=null;
try{
  var raw=localStorage.getItem("barlive:last-web-location-v1");
  if(raw){
    var p=JSON.parse(raw);
    var la=Number(p.latitude),lo=Number(p.longitude);
    if(isFinite(la)&&isFinite(lo))lastCoords={latitude:la,longitude:lo};
  }
}catch(_){}

function txt(el){return String(el&&el.textContent||"").replace(/\s+/g," ").trim()}

function fixLogo(){
  var imgs=document.querySelectorAll("img");
  for(var i=0;i<imgs.length;i++){
    var img=imgs[i],r=null;
    try{r=img.getBoundingClientRect()}catch(_){}
    var alt=String(img.getAttribute("alt")||"").toLowerCase();
    var src=String(img.getAttribute("src")||"").toLowerCase();
    var broken=img.complete&&img.naturalWidth===0;
    var sidebarish=r&&r.left<380&&r.top<120&&r.width<260&&r.height<100;
    if(alt.indexOf("barlive")!==-1||src.indexOf("barlive")!==-1||(broken&&sidebarish)){
      if(img.src!==LOGO)img.src=LOGO;
      img.alt="BarLive";
      img.style.objectFit="contain";
      img.style.width="120px";
      img.style.height="38px";
      img.style.maxWidth="120px";
    }
  }
}

function raiseProvince(){
  var nodes=document.querySelectorAll("div,span");
  for(var i=0;i<nodes.length;i++){
    if(txt(nodes[i])!=="Provincia")continue;
    var p=nodes[i];
    for(var d=0;d<6&&p;d++,p=p.parentElement){
      var r=null;try{r=p.getBoundingClientRect()}catch(_){}
      if(r&&r.width>=180&&r.width<=460&&r.height>=120){
        p.setAttribute("data-barlive-province-layer","1");
        p.style.zIndex="2147483000";
        p.style.overflow="hidden";
        var a=p.parentElement;
        for(var x=0;x<5&&a;x++,a=a.parentElement){
          a.setAttribute("data-barlive-province-parent","1");
        }
        return;
      }
    }
  }
}

function frames(){
  return Array.prototype.slice.call(document.querySelectorAll("iframe"));
}
function applyCoords(coords,zoom){
  if(!coords)return;
  frames().forEach(function(frame){
    try{
      var w=frame.contentWindow;
      if(!w)return;
      if(typeof w.updateUserLocation==="function")w.updateUserLocation(coords.latitude,coords.longitude);
      if(typeof w.flyToLocation==="function")w.flyToLocation(coords.latitude,coords.longitude,zoom||13);
    }catch(_){}
  });
}
function persist(coords,accuracy){
  lastCoords=coords;
  try{
    localStorage.setItem("barlive:last-web-location-v1",JSON.stringify({
      latitude:coords.latitude,longitude:coords.longitude,
      accuracy:accuracy==null?null:accuracy,timestamp:Date.now()
    }));
  }catch(_){}
}
function requestLocation(center){
  if(geoBusy)return;
  if(!navigator.geolocation){if(center&&lastCoords)applyCoords(lastCoords,13);return}
  geoBusy=true;
  navigator.geolocation.getCurrentPosition(function(pos){
    geoBusy=false;
    var coords={latitude:Number(pos.coords.latitude),longitude:Number(pos.coords.longitude)};
    if(!isFinite(coords.latitude)||!isFinite(coords.longitude))return;
    persist(coords,pos.coords.accuracy);
    applyCoords(coords,center?13:13);
  },function(){
    geoBusy=false;
    if(center&&lastCoords)applyCoords(lastCoords,13);
  },{enableHighAccuracy:false,timeout:10000,maximumAge:300000});
}
function installMiniCenter(){
  if(!/^\/explorar\/?$/.test(location.pathname.replace(/^\/\(tabs\)/,"")))return;
  var fs=frames();
  if(!fs.length)return;
  // Explore desktop has one embedded map iframe; attach control to its containing map card.
  for(var i=0;i<fs.length;i++){
    var frame=fs[i],parent=frame.parentElement;
    if(!parent)continue;
    var r=null;try{r=frame.getBoundingClientRect()}catch(_){}
    if(!r||r.width<240||r.height<180)continue;
    if(parent.querySelector&&parent.querySelector("#barlive-mini-center-v48"))continue;
    try{
      var cs=getComputedStyle(parent);
      if(cs.position==="static")parent.style.position="relative";
    }catch(_){parent.style.position="relative"}
    var b=document.createElement("button");
    b.id="barlive-mini-center-v48";
    b.type="button";
    b.title="Centrar en mi ubicación";
    b.setAttribute("aria-label","Centrar en mi ubicación");
    b.textContent="⌾";
    b.addEventListener("click",function(ev){ev.preventDefault();ev.stopPropagation();requestLocation(true)});
    parent.appendChild(b);
    break;
  }
}

function afterUi(){
  fixLogo();
  installMiniCenter();
}
function start(){
  fixLogo();
  installMiniCenter();
  if(lastCoords)applyCoords(lastCoords,13);
  requestLocation(true);
  setTimeout(afterUi,300);
  setTimeout(afterUi,1200);
  setTimeout(function(){if(lastCoords)applyCoords(lastCoords,13)},2200);
  document.addEventListener("click",function(){
    setTimeout(function(){raiseProvince();fixLogo();installMiniCenter()},30);
  },true);
  addEventListener("resize",function(){setTimeout(afterUi,80)},{passive:true});
  addEventListener("popstate",function(){setTimeout(afterUi,100)});
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start,{once:true});else start();
})();
