<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#641B73" />
  <title>BarLive</title>
  <style>
    html,body,#barlive-frame{margin:0;padding:0;width:100%;height:100%;border:0;background:#fff}
    html,body{overflow:hidden}
    #barlive-frame{position:fixed;inset:0}
  </style>
</head>
<body>
  <iframe
    id="barlive-frame"
    title="BarLive"
    allow="geolocation; camera; microphone; clipboard-read; clipboard-write; fullscreen"
  ></iframe>
  <script>
    (function () {
      var origin = 'https://barlive-web-current.onrender.com';
      var path = window.location.pathname + window.location.search + window.location.hash;
      var frame = document.getElementById('barlive-frame');
      frame.src = origin + '/?__barlive_path=' + encodeURIComponent(path);

      function sendLocation() {
        if (!frame.contentWindow) return;

        if (!navigator.geolocation) {
          frame.contentWindow.postMessage({
            type: 'BARLIVE_LOCATION_RESPONSE',
            ok: false,
            error: 'Geolocation not supported'
          }, origin);
          return;
        }

        navigator.geolocation.getCurrentPosition(function (position) {
          frame.contentWindow.postMessage({
            type: 'BARLIVE_LOCATION_RESPONSE',
            ok: true,
            coords: {
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy
            },
            timestamp: Date.now()
          }, origin);
        }, function (error) {
          frame.contentWindow.postMessage({
            type: 'BARLIVE_LOCATION_RESPONSE',
            ok: false,
            error: error && error.message ? error.message : 'Location permission denied',
            code: error && typeof error.code !== 'undefined' ? error.code : null
          }, origin);
        }, {
          enableHighAccuracy: false,
          timeout: 15000,
          maximumAge: 300000
        });
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== origin) return;
        if (!event.data || event.data.type !== 'BARLIVE_LOCATION_REQUEST') return;
        sendLocation();
      });
    })();
  </script>
</body>
</html>
